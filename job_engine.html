    function App() {
      const [candidateProfile] = useState(INITIAL_MASTER_PROFILE);
      const [jobs, setJobs] = useState(INITIAL_JOBS);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [notification, setNotification] = useState(null);
      const [filterPriority, setFilterPriority] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [searchKeyword, setSearchKeyword] = useState('');
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editingJob, setEditingJob] = useState(null);

      const [customJobInput, setCustomJobInput] = useState({
        title: '',
        company: '',
        location: 'Dhaka, Bangladesh',
        salary: 'Negotiable / Market Standard',
        source: 'Company Career Page',
        jobUrl: '',
        description: ''
      });

      const showToast = useCallback((message, type = 'success') => {
        setNotification({ message, type, id: Date.now() });
        setTimeout(() => setNotification(null), 4000);
      }, []);

      const metrics = useMemo(() => {
        const total = jobs.length;
        const awaitingApproval = jobs.filter(j => j.status === 'Awaiting Approval').length;
        const applied = jobs.filter(j => j.status === 'Applied').length;
        const highMatch = jobs.filter(j => j.matchScore >= 85).length;
        return { total, awaitingApproval, applied, highMatch };
      }, [jobs]);

      const handleApprovalAction = (jobId, action) => {
        setJobs(prevJobs => prevJobs.map(job => {
          if (job.id === jobId) {
            let newStatus = job.status;
            if (action === 'APPROVE') newStatus = 'Applied';
            else if (action === 'REJECT') newStatus = 'Rejected';
            else if (action === 'SAVE') newStatus = 'Saved';
            return { ...job, status: newStatus };
          }
          return job;
        }));

        if (action === 'APPROVE') showToast(`Job #${jobId} Approved & Marked as Applied!`);
        else if (action === 'REJECT') showToast(`Job #${jobId} Rejected from queue.`, 'warning');
        else if (action === 'SAVE') showToast(`Job #${jobId} saved for later.`);
      };

      const handleIngestNewJob = (e) => {
        e.preventDefault();
        if (!customJobInput.title || !customJobInput.company) {
          showToast('Please enter both Job Title and Company Name', 'warning');
          return;
        }

        const newJobObj = {
          id: `JOB-${String(jobs.length + 1).padStart(3, '0')}`,
          title: customJobInput.title,
          company: customJobInput.company,
          location: customJobInput.location || "Dhaka, Bangladesh",
          employmentType: "Full-Time",
          workArrangement: "Onsite/Hybrid",
          salary: customJobInput.salary,
          postedDate: new Date().toISOString().split('T')[0],
          deadline: "2026-10-15",
          source: customJobInput.source,
          jobUrl: customJobInput.jobUrl || "https://example.com/jobs/sqa",
          description: customJobInput.description || "Testing role focusing on software verification, bug reporting, and API checks.",
          requiredSkills: ["Manual Testing", "Test Case Design", "Jira", "SQL"],
          status: "Awaiting Approval",
          priority: "Priority A",
          matchScore: 88,
          strongMatches: ["B.Sc. CSE Degree matching requirement", "Testing background verified"],
          gaps: ["Advanced UI automation testing framework experience"],
          atsScore: 92,
          keywordMatchPct: 90,
          tailoredResume: {
            summary: `Qualified SQA Specialist with verified background in software testing, defect lifecycle reporting in Jira, and database validation.`,
            orderedSkills: ["Manual Testing", "Test Case Design", "Jira", "SQL Queries"],
            highlightedBullets: candidateProfile.experience[0].bullets.slice(0, 3)
          },
          coverLetter: `Dear Hiring Team at ${customJobInput.company},\n\nI am writing to express my interest in the ${customJobInput.title} position...`,
          applicationQuestions: [
            { question: `Why are you interested in joining ${customJobInput.company}?`, answer: `${customJobInput.company}'s reputation for technical excellence aligns with my QA career goals.` }
          ]
        };

        setJobs([newJobObj, ...jobs]);
        setCustomJobInput({ title: '', company: '', location: 'Dhaka, Bangladesh', salary: 'Negotiable / Market Standard', source: 'Company Career Page', jobUrl: '', description: '' });
        showToast(`Job ingested! Added to Human Approval Queue.`);
      };

      const exportJobsToCSV = () => {
        const headers = ["Job ID", "Title", "Company", "Location", "Match Score", "Priority", "Status", "Salary"];
        const rows = jobs.map(j => [j.id, `"${j.title}"`, `"${j.company}"`, `"${j.location}"`, `${j.matchScore}%`, j.priority, j.status, `"${j.salary}"`]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `SQA_Job_Search_Export.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Job Database Exported to CSV!");
      };

      const filteredJobs = jobs.filter(job => {
        const matchPrio = filterPriority === 'ALL' || job.priority === filterPriority;
        const matchStat = filterStatus === 'ALL' || job.status === filterStatus;
        const matchSearch = searchKeyword === '' || job.title.toLowerCase().includes(searchKeyword.toLowerCase()) || job.company.toLowerCase().includes(searchKeyword.toLowerCase());
        return matchPrio && matchStat && matchSearch;
      });

                        </div>
                      </div>

                      <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-xs text-slate-300">
                        <p className="font-semibold text-emerald-400">Tailored Resume Summary:</p>
                        <p className="text-[11px] text-slate-400 mt-1">{job.tailoredResume.summary}</p>
                      </div>

                      <div className="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800 text-xs">
                        <button onClick={() => handleApprovalAction(job.id, 'APPROVE')} className="py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold">
                          APPROVE
                        </button>
                        <button onClick={() => { setEditingJob(job); setIsEditModalOpen(true); }} className="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium">
                          REVIEW
                        </button>
                        <button onClick={() => handleApprovalAction(job.id, 'REJECT')} className="py-2 rounded-lg bg-slate-900 hover:bg-red-950 text-red-400 border border-slate-800 font-medium">
                          REJECT
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'queue' && (
              <div className="space-y-4">
                <div className="bg-amber-950/30 border border-amber-800 p-4 rounded-xl text-xs text-amber-200">
                  <p className="font-bold">Human Gatekeeper Queue Active</p>
                  <p className="text-amber-300/80 mt-1">Review tailored application materials and click Approve to authorize submission.</p>
                </div>
                {jobs.filter(j => j.status === 'Awaiting Approval').map((job) => (
                  <div key={job.id} className="bg-slate-900 border-2 border-amber-500/50 rounded-2xl p-6 space-y-4">
                    <div className="flex justify-between items-start">
                      <div>
                        <h3 className="text-lg font-bold text-white">{job.title}</h3>
                        <p className="text-xs text-cyan-400">{job.company} • {job.salary}</p>
                      </div>
                      <div className="text-right">
                        <p className="text-2xl font-black text-emerald-400">{job.atsScore}%</p>
                        <p className="text-[10px] text-slate-400 uppercase">ATS Resume Score</p>
                      </div>
                    </div>

                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs space-y-2">
                      <p className="font-semibold text-slate-300">Auto-Prepared Screening Answer:</p>
                      {job.applicationQuestions.map((q, i) => (
                        <p key={i} className="text-slate-400"><strong className="text-slate-300">Q: {q.question}</strong><br/>A: {q.answer}</p>
                      ))}
                    </div>

                    <div className="flex gap-3 justify-end">
                      <button onClick={() => handleApprovalAction(job.id, 'APPROVE')} className="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">
                        AUTHORIZE &amp; APPLY
                      </button>
                      <button onClick={() => handleApprovalAction(job.id, 'REJECT')} className="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-red-950 text-red-400 border border-slate-800 text-xs">
                        REJECT
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'search' && (
              <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <h2 className="text-lg font-bold text-white">Ingest New Job Posting</h2>
                <form onSubmit={handleIngestNewJob} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input
                      type="text"
                      required
                      placeholder="Job Title *"
                      value={customJobInput.title}
                      onChange={(e) => setCustomJobInput({ ...customJobInput, title: e.target.value })}
                      className="bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500"
                    />
                    <input
                      type="text"
                      required
                      placeholder="Company Name *"
                      value={customJobInput.company}
                      onChange={(e) => setCustomJobInput({ ...customJobInput, company: e.target.value })}
                      className="bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500"
                    />
                  </div>
                  <textarea
                    rows={4}
                    placeholder="Paste full Job Description text..."
                    value={customJobInput.description}
                    onChange={(e) => setCustomJobInput({ ...customJobInput, description: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500"
                  />
                  <button type="submit" className="px-5 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold">
                    Process &amp; Add to Queue
                  </button>
                </form>
              </div>
            )}

            {activeTab === 'profile' && (
              <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4 text-xs">
                <h2 className="text-lg font-bold text-white">Master Candidate Profile</h2>
                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                  <p><span className="text-slate-400">Name:</span> <strong className="text-white">{candidateProfile.fullName}</strong></p>
                  <p><span className="text-slate-400">Degree:</span> <span className="text-slate-200">{candidateProfile.education.degree} ({candidateProfile.education.university})</span></p>
                  <p><span className="text-slate-400">Testing Methodologies:</span> <span className="text-cyan-300">{candidateProfile.skills.testingMethodologies.join(', ')}</span></p>
                  <p><span className="text-slate-400">Tools &amp; Databases:</span> <span className="text-emerald-300">{candidateProfile.skills.tools.join(', ')}, {candidateProfile.skills.technical.join(', ')}</span></p>
                </div>
              </div>
            )}

          </main>

          {/* Edit Modal */}
          {isEditModalOpen && editingJob && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 text-xs">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-lg w-full space-y-4">
                <h3 className="text-base font-bold text-white">Review &amp; Edit Application</h3>
                <div>
                  <label className="text-slate-400 block mb-1">Tailored Summary</label>
                  <textarea
                    rows={3}
                    value={editingJob.tailoredResume.summary}
                    onChange={(e) => setEditingJob({ ...editingJob, tailoredResume: { ...editingJob.tailoredResume, summary: e.target.value } })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"
                  />
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setIsEditModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">Cancel</button>
                  <button onClick={() => {
                    setJobs(prev => prev.map(j => j.id === editingJob.id ? editingJob : j));
                    setIsEditModalOpen(false);
                    showToast("Edits saved!");
                  }} className="px-4 py-2 rounded-xl bg-cyan-600 text-white font-bold">Save</button>
                </div>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800 bg-slate-950 py-4 text-center text-xs text-slate-500">
            Hosted via GitHub Pages • Static Single File Application
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
