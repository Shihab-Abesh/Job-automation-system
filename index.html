  <ResumeSection title="PROJECTS">{d.overridden?<pre className="text-[10px] leading-4 whitespace-pre-wrap font-sans">{d.projectsText}</pre>:d.projects.map((x,i)=><div key={i} className="mb-3"><p className="text-[10.5px]"><b>{x.name||x.title}</b>{x.subtitle&&<span>, {x.subtitle}</span>}</p><ul className="list-disc ml-5 mt-1 text-[10px] leading-4">{x.bullets.map((b,n)=><li key={n}>{b}</li>)}</ul></div>)}</ResumeSection>
  <ResumeSection title="EDUCATION">{d.education.map((e,i)=><div key={i} className="mb-2"><div className="flex justify-between text-[10.5px]"><b>{e.degree}</b><span>{e.date}</span></div><p className="text-[10px] leading-4">{e.detail}</p></div>)}</ResumeSection>
  {d.references.length>0&&<ResumeSection title="REFERENCES"><div className="grid grid-cols-2 gap-4">{d.references.map((r,i)=><div key={i} className="text-[10px] leading-4"><p className="font-bold text-[10.5px]">{r.name}</p><p>{r.title}</p><p>{r.contact}</p></div>)}</div></ResumeSection>}
 </div>
}

/* ---- Applications: the recorded versions (versions.js) ---- */
const versionStem=v=>(v.fileName||`resume_${v.appliedOn}`).replace(/\.(pdf|docx|txt)$/i,"");
const rupees=n=>Number(n).toLocaleString("en-US")+" Tk";

function VersionDetail({v,prev,job,onUpdate,openJob,notify}){
 const [note,setNote]=useState(v.note||"");
 const d=diffVersions(prev,v);
 const posted=v.salary.postedText||(v.salary.postedMin!=null?rupees(v.salary.postedMin)+(v.salary.postedMax!=null&&v.salary.postedMax!==v.salary.postedMin?" to "+rupees(v.salary.postedMax):""):"not stated");
 const texts=[["cover","Cover letter",v.pack.coverLetter],["email","Email draft",v.pack.email],["recruiter","Recruiter / LinkedIn message",v.pack.recruiter]];
 return <div data-testid="version-detail" className="mt-4 border-t border-slate-800 pt-4 space-y-4">
  <div className="text-xs text-slate-400 space-y-1">
   <p>Recorded {new Date(v.appliedAt).toLocaleString()} when you pressed Mark Applied or Record current version. It is the copy the app held then; it cannot know what you actually attached or typed into an email, so compare it with what you really sent.</p>
   <p>Pay in the post: <span className="text-slate-200">{posted}</span> · Suggested ask: <span className="text-slate-200">{v.salary.suggested!=null?rupees(v.salary.suggested):"none"}</span>{v.salary.note&&<span className="text-slate-500"> ({v.salary.note})</span>}</p>
   {v.report.matchAfter!=null&&<p>Keyword match: {v.report.matchBefore}/100 before, {v.report.matchAfter}/100 after your Add choices{v.report.roleFit!=null&&<> · Role fit {v.report.roleFit}%</>}</p>}
   {v.report.gaps.length>0&&<div><p>Gaps the report listed:</p><ul className="list-disc ml-5 text-amber-200">{v.report.gaps.map((g,i)=><li key={i}>{g}</li>)}</ul></div>}
  </div>
  <div><label className="text-xs text-slate-400">Your note (interview date, who replied, what to remember)</label>
   <textarea data-testid="version-note" value={note} onChange={e=>setNote(e.target.value)} onBlur={()=>{if(note!==(v.note||""))onUpdate(v.id,{note})}} className="w-full h-16 bg-slate-950 border border-slate-700 rounded p-2 text-sm mt-1"/></div>
  <div><p className="text-xs font-semibold text-slate-300 mb-1">Compared with the previous version for this job</p>
   {d.first?<p data-testid="version-diff" className="text-xs text-slate-400">This is the first version recorded for this job.</p>
    :d.identical?<p data-testid="version-diff" className="text-xs text-slate-400">Identical to the previous version.</p>
    :<div data-testid="version-diff" className="text-xs space-y-0.5">{d.changed.length>0&&<p className="text-slate-200">Changed: {d.changed.join(", ")}</p>}{d.keywordsAdded.length>0&&<p className="text-emerald-300">Keywords added: {d.keywordsAdded.join(", ")}</p>}{d.keywordsRemoved.length>0&&<p className="text-amber-300">Keywords removed: {d.keywordsRemoved.join(", ")}</p>}</div>}
  </div>
  <div><p className="text-xs font-semibold text-slate-300 mb-2">Resume, as recorded</p><div data-testid="version-preview"><ResumePreview doc={v.doc}/></div></div>
  {texts.map(([id,label,text])=><div key={id}><div className="flex items-center gap-2 mb-1"><p className="text-xs font-semibold text-slate-300">{label}, as recorded</p><button type="button" data-testid={"version-copy-"+id} onClick={()=>copyText(text,notify,label)} className={packBtn}>Copy</button></div><pre data-testid={"version-"+id} className="whitespace-pre-wrap font-sans text-xs bg-slate-950 border border-slate-800 rounded p-3 text-slate-200">{text||"(empty)"}</pre></div>)}
  <details><summary className="text-xs text-slate-400 cursor-pointer">The job post as it was when recorded</summary><pre data-testid="version-description" className="whitespace-pre-wrap font-sans text-xs bg-slate-950 border border-slate-800 rounded p-3 mt-2 text-slate-300 max-h-80 overflow-auto">{v.description||"(not kept)"}</pre></details>
  <div className="flex flex-wrap gap-2 text-xs">{job?<button onClick={()=>openJob(job)} className={packBtn}>Open this job</button>:<span className="text-slate-500">This job is no longer in your list; the record above is still complete.</span>}{v.url&&<a href={v.url} target="_blank" rel="noopener noreferrer" className={packBtn+" text-cyan-300"}>Open application page</a>}</div>
 </div>
}

function ApplicationsPanel({versions,ready,error,onStartFresh,jobs,openId,setOpenId,onUpdate,onDelete,onImport,openJob,notify}){
 const [q,setQ]=useState("");
 const [confirmId,setConfirmId]=useState(null);
 const list=sortNewest(versions).filter(v=>[v.company,v.title,v.fileName,v.strategyLabel,v.keywordsAdded.join(" "),v.note].join(" ").toLowerCase().includes(q.trim().toLowerCase()));
 const jobFor=v=>jobs.find(j=>(v.jobId&&j.id===v.jobId)||(v.jobFingerprint&&j.fingerprint===v.jobFingerprint));
 const kb=Math.max(1,Math.round(versionsStorageBytes(versions)/1024));
 const exportAll=()=>download(`careerpilot-applications-${vnLocalDate(new Date())}.json`,JSON.stringify({app:"careerpilot-bd",kind:"recorded-versions",exportedAt:new Date().toISOString(),versions},null,2),"application/json");
 const importFile=e=>{
  const f=e.target.files[0];e.target.value="";
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
   try{
    const data=JSON.parse(r.result);
    const raw=Array.isArray(data)?data:(data&&Array.isArray(data.versions)?data.versions:null);
    if(!raw)throw new Error("no versions");
    const valid=normalizeVersions(raw).length;
    const res=onImport(raw);
    if(res.blocked){notify("Could not keep the unreadable copy aside (browser storage is full), so nothing was imported.");return;}
    const skipped=raw.length-valid,already=valid-res.added;
    notify(`Imported ${res.added} new version${res.added===1?"":"s"}${already>0?`, ${already} already here`:""}${skipped>0?`, ${skipped} skipped as not valid`:""}.`);
   }catch(err){notify("That file is not a CareerPilot applications export.")}
  };
  r.readAsText(f);
 };
 return <section className="space-y-4" data-testid="applications-panel">
  <div><h2 className="text-xl font-bold">Applications</h2><p className="text-sm text-slate-400">The resume, cover letter, email and keywords exactly as they were when you pressed Mark Applied (or Record current version), one entry per version. If an interview comes, this is the wording the employer received.</p></div>
  {error&&<div data-testid="versions-error" className="bg-red-950/40 border border-red-800 text-red-200 text-xs rounded-lg p-3 flex flex-wrap items-center gap-3"><span className="flex-1 min-w-[240px]">{error}</span>{!ready&&<button data-testid="versions-start-fresh" onClick={onStartFresh} className="px-3 py-1.5 rounded bg-red-900 text-white">Start fresh</button>}</div>}
  <div className="no-print flex flex-wrap items-center gap-2 text-xs">
   <input data-testid="versions-search" aria-label="Search recorded versions" placeholder="Search company, role, keyword, note..." value={q} onChange={e=>setQ(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-3 py-2 w-72"/>
   <button data-testid="versions-export" onClick={exportAll} disabled={!versions.length} className="bg-slate-800 px-3 py-2 rounded disabled:opacity-40">Export JSON</button>
   <label className="bg-slate-800 px-3 py-2 rounded cursor-pointer">Import JSON<input data-testid="versions-import" type="file" accept=".json,application/json" className="hidden" onChange={importFile}/></label>
   <span data-testid="versions-storage" className="text-slate-500">{versions.length} version{versions.length===1?"":"s"} · about {kb} KB of the browser's roughly 5 MB, shared with your jobs and profile</span>
  </div>
  <p className="text-[11px] text-slate-500">These are stored encrypted with your vault password, and that password cannot be recovered. Export now and then. The export file is <b className="text-slate-300">not</b> encrypted (it holds your phone and email), so keep it somewhere private.</p>
  {!list.length&&<div data-testid="versions-empty" className="text-slate-400 bg-slate-900 border border-slate-800 rounded-xl p-8 text-center">{versions.length?"No recorded version matches that search.":"Nothing recorded yet. Open a job's resume and press Mark Applied to keep a copy of exactly what it says."}</div>}
  <div className="space-y-3">{list.map(v=>{
   const sameJob=versionsForJob(versions,{id:v.jobId,fingerprint:v.jobFingerprint});
   const at=sameJob.findIndex(x=>x.id===v.id);
   const prev=sameJob[at+1]||null;
   const job=jobFor(v);
   const open=openId===v.id;
   return <div key={v.id} data-testid="version-card" data-id={v.id} className={"bg-slate-900 border rounded-xl p-4 "+(open?"border-cyan-700":"border-slate-800")}>
    <div className="flex flex-wrap justify-between gap-3">
     <div className="min-w-0">
      <p className="font-bold">{v.title||"Untitled role"} <span className="text-cyan-400 font-normal">· {v.company||"Unknown company"}</span></p>
      <p className="text-xs text-slate-400 mt-0.5">Applied {formatDay(v.appliedOn)}{sameJob.length>1?` · version ${sameJob.length-at} of ${sameJob.length} for this job`:""}{job&&<> · <span data-testid="version-status" className="text-slate-300">{job.status}</span></>}</p>
      <p className="text-xs text-slate-500 mt-1">File <code className="text-slate-300" data-testid="version-file">{v.fileName||"(none)"}</code> · Strategy <span className="text-slate-300" data-testid="version-strategy">{v.strategyLabel||v.strategy||"-"}</span></p>
      <p className="text-xs mt-1.5 flex flex-wrap gap-1" data-testid="version-keywords"><span className="text-slate-500 mr-1">Keywords added</span>{v.keywordsAdded.length?v.keywordsAdded.map(k=><span key={k} className="bg-emerald-950/50 text-emerald-200 border border-emerald-800 px-2 py-0.5 rounded-full">{k}</span>):<span className="text-slate-500">none</span>}</p>
      {v.note&&<p className="text-xs text-amber-200 mt-1.5" data-testid="version-note-preview">Note: {v.note}</p>}
     </div>
     <div className="no-print flex flex-wrap items-start gap-1.5">
      <button data-testid="version-open" onClick={()=>setOpenId(open?null:v.id)} className={packBtn+" text-cyan-300"}>{open?"Hide":"View"}</button>
      <button data-testid="version-pdf" onClick={()=>renderResumePDF(v.doc,versionStem(v)+".pdf")} className={packBtn}>PDF</button>
      <button data-testid="version-docx" onClick={()=>renderResumeDOCX(v.doc,versionStem(v)+".docx")} className={packBtn}>DOCX</button>
      <button data-testid="version-txt" onClick={()=>download(versionStem(v)+".txt",resumeDocToText(v.doc))} className={packBtn}>TXT</button>
      {confirmId===v.id
       ?<><button data-testid="version-delete-confirm" onClick={()=>{onDelete(v.id);setConfirmId(null);notify("Version deleted.")}} className="px-2.5 py-1 rounded text-[11px] bg-red-800 text-white">Delete for good</button><button onClick={()=>setConfirmId(null)} className={packBtn}>Keep</button></>
       :<button data-testid="version-delete" onClick={()=>setConfirmId(v.id)} className={packBtn+" text-red-300"}>Delete</button>}
     </div>
    </div>
    {open&&<VersionDetail key={v.id} v={v} prev={prev} job={job} onUpdate={onUpdate} openJob={openJob} notify={notify}/>}
   </div>})}
  </div>
 </section>
}

function CheckRow({ok,text}){return <p className="text-xs flex gap-2 items-start"><span className={ok?'text-emerald-400':'text-amber-400'}>{ok?'✓':'!'}</span>{text}</p>}

const MANUAL_KEY="careerpilot_bd_v2_manual_checked";
const localToday=()=>new Date().toLocaleDateString("en-CA");
const daysSince=d=>Math.round((new Date(localToday())-new Date(d))/86400000);
const isWebUrl=u=>typeof u==="string"&&(u.startsWith("https://")||u.startsWith("http://"));
// Boards the pipeline cannot read (bot protection, no terms permission, no structured data).
// The list lives in config/manual_sites.json so it can be edited without touching this file.
function ManualSites({p}){
 const titles=(p.preferences&&p.preferences.titles)||[];
 const [data,setData]=useState(null);
 const [failed,setFailed]=useState(false);
 const [title,setTitle]=useState(titles[0]||"");
 const [checked,setChecked]=useState(()=>{try{return JSON.parse(localStorage.getItem(MANUAL_KEY)||"{}")}catch{return {}}});
 useEffect(()=>{
  fetch("config/manual_sites.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(setData).catch(()=>setFailed(true));
 },[]);
 useEffect(()=>{try{localStorage.setItem(MANUAL_KEY,JSON.stringify(checked))}catch{}},[checked]);
 const today=localToday();
 const sites=((data&&data.sites)||[]).filter(s=>isWebUrl(s.url));
 const automatic=((data&&data.automatic)||[]).filter(s=>isWebUrl(s.url));
 const groups=[...new Set(sites.map(s=>s.group||"Other"))];
 const doneToday=sites.filter(s=>checked[s.id]===today).length;
 const toggle=id=>setChecked(c=>{const n={...c};if(n[id]===today)delete n[id];else n[id]=today;return n});
 const searchLink=s=>isWebUrl(s.searchUrl)&&title?s.searchUrl.split("{query}").join(encodeURIComponent(title)):null;
 return <section className="space-y-6">
  <div><h2 className="text-xl font-bold">Manual Sites</h2><p className="text-sm text-slate-400 mt-1">Job sites the system cannot read for you, each with the honest reason. Open them yourself, then tick them off. Your ticks stay in this browser.</p></div>
  {failed&&<div className="bg-amber-950/40 border border-amber-800 rounded-xl p-4 text-sm text-amber-200">Could not load config/manual_sites.json. Open the dashboard from its GitHub Pages address (or with start.bat) rather than double-clicking the file.</div>}
  {!data&&!failed&&<div className="text-slate-400 text-sm">Loading the list...</div>}
  {data&&<>
   <div className="no-print flex flex-wrap items-center gap-3 text-xs bg-slate-900 border border-slate-800 rounded-xl p-4">
    <label className="flex items-center gap-2 text-slate-300">Search these sites for
     <select aria-label="Target title" value={title} onChange={e=>setTitle(e.target.value)} className="bg-slate-950 border border-slate-700 rounded px-2 py-2">{titles.map(t=><option key={t} value={t}>{t}</option>)}</select>
    </label>
    <span className="text-slate-500" data-testid="manual-progress">{doneToday} of {sites.length} checked today</span>
   </div>
   {groups.map(g=><div key={g} data-testid="manual-group">
    <h3 className="font-semibold text-cyan-300 mb-2">{g}</h3>
    <div className="grid lg:grid-cols-2 gap-3">{sites.filter(s=>(s.group||"Other")===g).map(s=>{
     const last=checked[s.id];const isToday=last===today;const sl=searchLink(s);
     return <div key={s.id} data-testid="manual-site" className={"border rounded-xl p-4 "+(isToday?"bg-emerald-950/30 border-emerald-900":"bg-slate-900 border-slate-800")}>
      <div className="flex justify-between gap-3"><b>{s.name}</b><span className={"text-[11px] whitespace-nowrap "+(isToday?"text-emerald-300":"text-slate-500")}>{isToday?"Checked today":last?`Last checked ${last} (${daysSince(last)} days ago)`:"Never checked"}</span></div>
      {s.note&&<p className="text-sm text-slate-300 mt-1">{s.note}</p>}
      {s.why&&<p className="text-xs text-slate-500 mt-2"><span className="text-slate-400">Why not automatic:</span> {s.why}</p>}
      <div className="flex flex-wrap gap-2 mt-3 text-xs">
       {sl&&<a href={sl} target="_blank" rel="noopener noreferrer" className="bg-cyan-600 px-3 py-2 rounded">Search "{title}"</a>}
       <a href={s.url} target="_blank" rel="noopener noreferrer" className="bg-slate-800 px-3 py-2 rounded text-cyan-300">Open site</a>
       <button onClick={()=>toggle(s.id)} className="bg-slate-800 px-3 py-2 rounded">{isToday?"Undo":"Mark checked today"}</button>
      </div>
     </div>})}</div>
   </div>)}
   {automatic.length>0&&<div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
    <h3 className="font-semibold">Already checked for you</h3>
    <p className="text-xs text-slate-400 mt-1">These arrive in Job Analysis by themselves twice a day, so there is nothing to do here.</p>
    <ul className="mt-3 space-y-1 text-sm">{automatic.map(s=><li key={s.id}><a href={s.url} target="_blank" rel="noopener noreferrer" className="text-cyan-300 underline">{s.name}</a><span className="text-slate-500"> · {s.note}</span></li>)}</ul>
   </div>}
  </>}
 </section>
}
function Tracker({jobs,setJobs,versions,versionsReady,openApplications}){
 const statuses=["Awaiting Review","Saved","Awaiting Approval","Applied","Interview","Rejected","Offer"];
 const appliedLike=["Applied","Interview","Rejected","Offer"];
 return <section><h2 className="text-xl font-bold mb-4">Application Tracker</h2><div className="space-y-3">{jobs.map(j=>{
  const mine=versionsForJob(versions,j);
  return <div key={j.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap justify-between gap-3"><div><b>{j.title}</b><p className="text-sm text-slate-400">{j.company}</p>
   {mine.length>0&&<button data-testid="tracker-versions" onClick={()=>openApplications(mine[0].id)} className="text-xs text-cyan-400 underline mt-1">{mine.length} recorded version{mine.length===1?"":"s"}</button>}
   {versionsReady&&!mine.length&&appliedLike.includes(j.status)&&<p data-testid="no-version-nudge" className="text-xs text-amber-300 mt-1 max-w-md">No version recorded for this application. Open this job's resume and press Record current version to keep a copy; it will hold what the resume says now, which may differ from what you sent earlier.</p>}
  </div><select value={j.status} onChange={e=>setJobs(jobs.map(x=>x.id===j.id?{...x,status:e.target.value}:x))} className="bg-slate-950 border border-slate-700 rounded p-2 text-sm">{statuses.map(s=><option key={s}>{s}</option>)}</select></div>})}</div></section>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
