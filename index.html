// message, privatedata.js) get the same treatment, keyed by job id. The job record itself stays unencrypted.
const PRIVATE_KEY="careerpilot_bd_v2_private";

/* Password-derived encryption for the profile only (name, contact links,
   resume content). Job listings stay unencrypted so review.html keeps
   working without a password prompt — they're public postings, not personal
   data. There is no recovery: losing the password means the vault cannot be
   decrypted by anyone, which is the point. */
function bufToB64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function b64ToBuf(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}
async function deriveKey(password,saltB64){
 const salt=saltB64?b64ToBuf(saltB64):crypto.getRandomValues(new Uint8Array(16));
 const keyMaterial=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},keyMaterial,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
 return {key,saltB64:bufToB64(salt)};
}
async function encryptJSON(key,obj){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const data=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));
 return {iv:bufToB64(iv),data:bufToB64(data)};
}
async function decryptJSON(key,ivB64,dataB64){
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBuf(ivB64)},key,b64ToBuf(dataB64));
 return JSON.parse(new TextDecoder().decode(plain));
}

/* A small encrypted store kept in localStorage as {iv,data} and opened with the vault key: the recorded
   versions and your private per-job edits use it. Two rules keep it safe. It is never written until it has
   been opened successfully, so a copy that cannot be read is never replaced by an empty one. And a copy
   that cannot be read is kept aside (never deleted) before anything replaces it. */
async function readVaultStore(key,storageKey,normalize,empty){
 try{
  const raw=localStorage.getItem(storageKey);
  if(!raw)return {value:empty,ready:true};
  const s=JSON.parse(raw);
  return {value:normalize(await decryptJSON(key,s.iv,s.data)),ready:true};
 }catch(e){return {value:empty,ready:false}}
}
// Moves a stored copy to <key>_unreadable (or a dated name if that is taken). False if it could not be kept.
function stashUnreadable(storageKey){
 try{
  const raw=localStorage.getItem(storageKey);
  if(raw==null)return true;
  let name=storageKey+"_unreadable";
  const taken=localStorage.getItem(name);
  if(taken!=null&&taken!==raw)name+="_"+Date.now();
  localStorage.setItem(name,raw);
  localStorage.removeItem(storageKey);
  return true;
 }catch(e){return false}
}
function useVaultStore(storageKey,cryptoKey,empty,noun,advice,notify){
 const [value,setValue]=useState(empty);
 const [ready,setReady]=useState(false);
 const [error,setError]=useState("");
 const seq=useRef(0);
 useEffect(()=>{
  if(!cryptoKey||!ready)return;
  const n=++seq.current;
  (async()=>{
   try{
    const enc=await encryptJSON(cryptoKey,value);
    if(n!==seq.current)return;          // a newer save is already on its way
    localStorage.setItem(storageKey,JSON.stringify(enc));
    setError("");
   }catch(e){
    const m=`Could not save your ${noun} (${e&&e.name==="QuotaExceededError"?"browser storage is full":"storage error"}). ${advice}`;
    setError(m);notify(m);
   }
  })();
 },[value,cryptoKey,ready]);
 return {
  value,setValue,ready,error,
  open:o=>{setValue(o.value);setReady(o.ready);setError(o.error||"")},
  close:()=>{setValue(empty);setReady(false);setError("")},
  // Give up on an unreadable copy: keep it aside, then start empty and let saving resume.
  startFresh:()=>{if(!stashUnreadable(storageKey))return false;setValue(empty);setReady(true);setError("");return true}
 };
}

function migrateProfile(raw){
 if(!raw||typeof raw!=="object")return null;
 const p={...raw};
 p.personal={...DEFAULT_PROFILE.personal,...(raw.personal||{})};
 p.education=(raw.education||[]).map(e=>({
  degree:e.degree||"",
  institution:e.institution||"",
  score:e.score||e.cgpa||"",
  date:e.date||e.graduation||""
 }));
 p.experience=(raw.experience||[]).map(e=>({role:e.role||"",company:e.company||"",location:e.location||"",duration:e.duration||"",bullets:e.bullets||[],tags:e.tags||[]}));
 p.projects=(raw.projects||[]).map(x=>({
  name:x.name||"",
  subtitle:x.subtitle||"",
  bullets:x.subtitle!==undefined&&x.subtitle!==""?(x.bullets||[]):[x.description,...(x.bullets||[])].filter(Boolean),
  skills:x.skills||[],
  categories:x.categories||[]
 }));
 if(Array.isArray(raw.skills)){
  p.skills=raw.skills.map(g=>({category:g.category||"",items:g.items||[]}));
 }else if(raw.skills&&typeof raw.skills==="object"){
  const labels={technical:"Technical",testing:"Software Testing",tools:"Tools",systems:"Systems",soft:"Soft Skills"};
  p.skills=Object.entries(raw.skills).map(([k,v])=>({category:labels[k]||k,items:v||[]}));
 }else{
  p.skills=[];
 }
 p.references=raw.references||[];
 const saved=raw.preferences||{};
 p.preferences={...DEFAULT_PROFILE.preferences,...saved};
 if((saved.version||1)<2){
  // Version 1 only targeted QA/MIS roles. Widen it once to CSE, management-trainee and business
  // roles, keeping everything the user already chose.
  const union=(a,b)=>[...a,...b.filter(x=>!a.some(y=>String(y).toLowerCase()===x.toLowerCase()))];
  const oldDefaultExcluded=["Senior Software Developer","Backend Developer","Full Stack Developer"];
  const excludedUntouched=Array.isArray(saved.excluded)&&saved.excluded.length===oldDefaultExcluded.length&&oldDefaultExcluded.every(x=>saved.excluded.includes(x));
  p.preferences={
   ...p.preferences,
   categories:union(p.preferences.categories,DEFAULT_PROFILE.preferences.categories),
   titles:union(p.preferences.titles,DEFAULT_PROFILE.preferences.titles),
   excluded:excludedUntouched||!saved.excluded?DEFAULT_PROFILE.preferences.excluded:p.preferences.excluded,
   version:2
  };
 }
 return p;
}

// For a job that fits none of the fixed strategies, in any field: a summary made only from your profile,
// the job title, and the keywords you pressed Add for. It states nothing you have not already written.
function generalSummary(p,job,skills){
 const edu=(p.education||[])[0]||{},exp=(p.experience||[])[0]||{};
 const field=(edu.degree||"").replace(/^.*?\bin\s+/i,"").trim();
 const who=field?`${field} graduate`:"Graduate";
 const where=exp.role&&exp.company?` with ${exp.role} experience at ${exp.company}`:exp.role?` with ${exp.role} experience`:"";
 const strengths=skills.length?` Strengths include ${skills.slice(0,6).join(", ")}.`:"";
 const goal=job.title?` Seeking the ${job.title} position${job.company?` at ${job.company}`:""}.`:"";
 return `${who}${where}.${strengths}${goal}`;
}
function summaryFor(strategy){const m={
"Software Quality Assurance":"Computer Science and Engineering graduate with hands-on Software Quality Assurance internship experience in manual, functional and regression testing of web applications. Experienced in UI verification, form validation, responsive and cross-browser testing, defect documentation, fix verification, and collaboration with development and project teams.",
"Information Technology":"Computer Science and Engineering graduate with practical exposure to web applications, databases, software quality validation, website infrastructure, hosting, DNS configuration, SSL setup, and technical problem solving through internship and academic projects.",
"Information Systems":"Computer Science and Engineering graduate with experience in information systems, relational databases, SQL, system analysis, requirements documentation, UML, risk analysis, and software validation through academic projects and practical QA experience.",
"MIS":"Computer Science and Engineering graduate with a foundation in management information systems, SQL, relational databases, data management, system analysis, and analytical problem solving.",
"Business Analysis":"Computer Science and Engineering graduate with academic experience in requirements analysis, UML, work breakdown structures, risk analysis, system validation, and database-backed application projects.",
"Application Support":"Computer Science and Engineering graduate with practical experience validating web applications, documenting defects, verifying fixes, working with databases, and exposure to hosting, DNS, SSL, and website migration.",
"Software Development":"Computer Science and Engineering graduate with hands-on web development experience in PHP, JavaScript, HTML, CSS and MySQL, including a database-backed CRUD application, plus relational database design in Oracle SQL and PL/SQL. Brings practical exposure to the software delivery cycle from an internship on a live website rebuild, working in Agile and Scrum teams alongside developers, designers and project managers.",
"Management & Business":"Computer Science and Engineering graduate whose software-company internship included client requirement meetings, Scrum and project meetings with developers, designers and project managers, and structured defect and requirement documentation. Academic projects covered work breakdown structures, COCOMO cost estimation and risk analysis. Combines analytical and technical skills with clear written communication, and is seeking a management trainee or business role.",
"Data & Reporting":"Computer Science and Engineering graduate with practical database experience in Oracle and MySQL, SQL queries, database design, data integrity, data management, and analytical problem solving."};return m[strategy]||m["Information Systems"]}
// kws are the job's recruiter keywords (keywords.js): a bullet or project that uses them moves up.
function scoreBullet(b,job,kws){return terms([job.title,job.description].join(" ")).filter(t=>normalize(b).includes(t)).length+3*keywordHits(b,kws||[])}
function projectScore(x,strategy,job,kws){const text=[x.name,x.subtitle||"",...(x.skills||[]),...x.bullets].join(" ");return (x.categories.includes(strategy)?20:0)+terms([job.title,job.description].join(" ")).filter(t=>normalize(text).includes(t)).length+3*keywordHits(text,kws||[])}
function hasPhrase(text,phrase){
 const p=normalize(phrase).trim();
 if(!p)return false;
 const esc=p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
 // Short keys ("mis", "mba") must be whole words; longer ones only need to start a word so plurals match.
 return new RegExp("(^|[^a-z0-9])"+esc+(p.length<=4?"($|[^a-z0-9])":"")).test(text);
}
function bestFitStrategy(job){
 const text=normalize([job.title,job.description].join(" "));
 // A job outside every fixed field gets the General resume, not a guess at some other field's.
 const fallback=job.category&&ROLE_STRATEGIES[job.category]?job.category:"General";
 let best=fallback,bestScore=0;
 for(const [key,cfg] of Object.entries(ROLE_STRATEGIES)){
  const s=(cfg.keywords||[]).filter(k=>hasPhrase(text,k)).length;
  if(s>bestScore){bestScore=s;best=key;}
 }
 return best;
}

function App(){
 const [vaultStatus,setVaultStatus]=useState(()=>localStorage.getItem(VAULT_KEY)?"locked":"setup");
 const [cryptoKey,setCryptoKey]=useState(null);
 const [lockError,setLockError]=useState("");
 const [profile,setProfile]=useState(null);
 const [jobs,setJobs]=useState(()=>JSON.parse(localStorage.getItem(JOB_KEY)||"[]"));
 const [tab,setTab]=useState("dashboard");
 const [selected,setSelected]=useState(null);
 const [editing,setEditing]=useState(false);
 const [toast,setToast]=useState("");
 const [jobForm,setJobForm]=useState({title:"",company:"",category:"Information Technology",location:"Dhaka, Bangladesh",source:"",url:"",description:""});
 const [search,setSearch]=useState("");
 const [profileText,setProfileText]=useState("");
 const [fCat,setFCat]=useState("all");
 const [fSrc,setFSrc]=useState("all");
 const [fPri,setFPri]=useState("all");
 const [sortBy,setSortBy]=useState("best");
 const [openVersion,setOpenVersion]=useState(null);
 const notify=m=>{setToast(m);setTimeout(()=>setToast(""),3500)};
 // Two encrypted stores, both opened at unlock and written back encrypted (see useVaultStore):
 // recorded resume versions (versions.js) and your private per-job edits (privatedata.js).
 const vStore=useVaultStore(VERSIONS_KEY,cryptoKey,NO_VERSIONS,"recorded versions","Export them now, then delete old ones, so nothing is lost.",notify);
 const pStore=useVaultStore(PRIVATE_KEY,cryptoKey,NO_PRIVATE,"saved resume and pack edits","Free some space by deleting old recorded versions or jobs. Until then, edits made now are held only until you lock or close this page.",notify);
 const versions=vStore.value,setVersions=vStore.setValue,versionsReady=vStore.ready,versionsError=vStore.error;
 const privateData=pStore.value;

 useEffect(()=>{
  if(!cryptoKey||!profile)return;
  (async()=>{
   const enc=await encryptJSON(cryptoKey,profile);
   const vault=JSON.parse(localStorage.getItem(VAULT_KEY)||"{}");
   localStorage.setItem(VAULT_KEY,JSON.stringify({...vault,iv:enc.iv,data:enc.data}));
  })();
 },[profile,cryptoKey]);
 useEffect(()=>localStorage.setItem(JOB_KEY,JSON.stringify(jobs)),[jobs]);
 // Opens the private store and moves what older versions of this page left on the job records into it.
 // The plain copy is removed from the job list only after the encrypted copy is safely written, so a
 // failed write never loses an edit; in that case the plain copy stays and the move is tried again next time.
 const openPrivateStore=async key=>{
  const r=await readVaultStore(key,PRIVATE_KEY,normalizePrivate,NO_PRIVATE);
  let data=r.value,error=r.ready?"":PRIVATE_UNREADABLE,moved=0;
  if(r.ready){
   const legacy=splitPrivate(jobs);
   if(legacy.count){
    data=mergePrivate(data,legacy.moved);
    try{
     localStorage.setItem(PRIVATE_KEY,JSON.stringify(await encryptJSON(key,data)));
     setJobs(legacy.jobs);moved=legacy.count;
    }catch(e){error="Your saved resume and pack edits could not be moved into the encrypted vault (browser storage may be full). They are still where they were and will be moved the next time you unlock.";}
   }
  }
  return {value:data,ready:r.ready,error,moved};
 };
 const announceMove=n=>{if(n)notify(`Moved your saved resume and pack edits for ${n} job${n===1?"":"s"} into the encrypted vault.`)};
 const createVault=async password=>{
  const {key,saltB64}=await deriveKey(password);
  const existing=migrateProfile(JSON.parse(localStorage.getItem(STORAGE_KEY)||"null"));
  const initial=existing||DEFAULT_PROFILE;
  const enc=await encryptJSON(key,initial);
  localStorage.setItem(VAULT_KEY,JSON.stringify({salt:saltB64,iv:enc.iv,data:enc.data}));
  localStorage.removeItem(STORAGE_KEY);
  // A brand new vault has a new key, so stores left by an old one cannot be read; keep them aside.
  stashUnreadable(VERSIONS_KEY);stashUnreadable(PRIVATE_KEY);
  vStore.open({value:NO_VERSIONS,ready:true,error:""});
  const pr=await openPrivateStore(key);
  pStore.open(pr);
  setCryptoKey(key);setProfile(initial);setVaultStatus("unlocked");
  if(existing)notify("Existing profile data in this browser was encrypted with your new password.");
  else announceMove(pr.moved);
 };
 const unlockVault=async password=>{
  setLockError("");
  try{
   const vault=JSON.parse(localStorage.getItem(VAULT_KEY));
   const {key}=await deriveKey(password,vault.salt);
   const decrypted=await decryptJSON(key,vault.iv,vault.data);
   // The password is right (the profile decrypted). Open the other two stores with the same key.
   const v=await readVaultStore(key,VERSIONS_KEY,normalizeVersions,NO_VERSIONS);
   vStore.open({value:v.value,ready:v.ready,error:v.ready?"":VERSIONS_UNREADABLE});
   const pr=await openPrivateStore(key);
   pStore.open(pr);
   setCryptoKey(key);setProfile(migrateProfile(decrypted)||DEFAULT_PROFILE);setVaultStatus("unlocked");
   announceMove(pr.moved);
  }catch(e){setLockError("Incorrect password.");}
 };
 const lockVault=()=>{setCryptoKey(null);setProfile(null);vStore.close();pStore.close();setOpenVersion(null);setVaultStatus("locked");setTab("dashboard");};
 // Hooks must run unconditionally on every render, so this stays above the
 // early return below (which only happens while locked/setting up) — moving
 // it after that return caused React to see a different hook count between
 // the locked and unlocked renders and silently fail to render anything.

  return{total:jobs.length,strong:scores.filter(x=>x>=bar).length,review:jobs.filter(j=>j.status==="Awaiting Review").length,applied:jobs.filter(j=>j.status==="Applied").length};
 },[jobs,profile]);
 if(vaultStatus!=="unlocked"){
  return <LockScreen mode={vaultStatus} onCreate={createVault} onUnlock={unlockVault} error={lockError}/>;
 }

  setJobs(prev=>prev.map(x=>x.id===id?{...x,...patch}:x));
  setSelected(prev=>prev&&prev.id===id?{...prev,...patch}:prev);
 };
 // Records what the resume and the Application Pack hold right now. The same content is never recorded
 // twice in a row for one job; the caller shows the message either way.
 const recordVersion=c=>{
  if(!versionsReady)return {ok:false,message:"Your recorded versions could not be opened, so this one was not recorded. See the warning in the Applications tab."};
  const v=makeVersion(c);
  const r=addVersion(versions,v);
  if(!r.added)return {ok:true,added:false,version:versions.find(x=>x.id===r.duplicateOf)};
  setVersions(r.list);
  return {ok:true,added:true,version:v};
 };
 const updateVersion=(id,patch)=>setVersions(prev=>prev.map(v=>v.id===id?{...v,...patch,updatedAt:new Date().toISOString()}:v));
 const deleteVersion=id=>setVersions(prev=>prev.filter(v=>v.id!==id));
 const importVersions=list=>{
  // Restoring an export is one way out of an unreadable store: keep the unreadable copy aside, then let saving resume.
  if(!versionsReady&&!vStore.startFresh())return {added:0,total:0,blocked:true};
  const before=versions.length;const merged=mergeVersions(versions,list);setVersions(merged);return {added:merged.length-before,total:merged.length};
 };
 // Your own words for one job live in the encrypted private store, never on the job record.
 const setPrivateFor=(jobId,patch)=>pStore.setValue(prev=>withPrivate(prev,jobId,patch));
 const deleteJob=j=>{setJobs(jobs.filter(x=>x.id!==j.id));pStore.setValue(prev=>dropPrivate(prev,j.id))};
 const openApplications=id=>{setOpenVersion(id||null);setTab("applications")};
 const saveProfileJSON=()=>{
  try{const obj=migrateProfile(JSON.parse(profileText));setProfile(obj);setEditing(false);notify("Profile saved successfully.");}

 };

 const importProfile=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{setProfile(migrateProfile(JSON.parse(r.result)));notify("Profile imported.");}catch{alert("Invalid profile file.");}};r.readAsText(f)};

     <select aria-label="Filter by source" value={fSrc} onChange={e=>setFSrc(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-2"><option value="all">All sources</option>{sourceOptions.map(s=><option key={s} value={s}>{s}</option>)}</select>
     <select aria-label="Filter by priority" value={fPri} onChange={e=>setFPri(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-2"><option value="all">Any priority</option><option value="A">A: strong</option><option value="B">B: worth a look</option><option value="C">C: read the note first</option></select>
     <select aria-label="Sort jobs" value={sortBy} onChange={e=>setSortBy(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-2"><option value="best">Sort: best match</option><option value="priority">Sort: priority</option><option value="newest">Sort: newest</option><option value="deadline">Sort: deadline soonest</option><option value="salary">Sort: highest salary</option></select>

function LockScreen({mode,onCreate,onUnlock,error}){
 const [pw,setPw]=useState("");
 const [pw2,setPw2]=useState("");
 const [busy,setBusy]=useState(false);
 const [localError,setLocalError]=useState("");
 const submit=async e=>{
  e.preventDefault();
  setLocalError("");
  if(mode==="setup"){
   if(pw.length<8){setLocalError("Use at least 8 characters.");return;}
   if(pw!==pw2){setLocalError("Passwords do not match.");return;}
   setBusy(true);await onCreate(pw);setBusy(false);
  }else{
   if(!pw){setLocalError("Enter your password.");return;}
   setBusy(true);await onUnlock(pw);setBusy(false);
  }
 };
 return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-slate-100 p-4">
  <form onSubmit={submit} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm space-y-4">
   <div><h1 className="font-bold text-lg">CareerPilot BD</h1><p className="text-xs text-cyan-400">Multi-Career Job Search & Truthful ATS Resume Engine</p></div>
   {mode==="setup"?<>
    <p className="text-sm text-slate-400">Set a password to encrypt your profile and resume data in this browser (AES-256, derived with PBKDF2). There is no recovery — if you forget it, this data cannot be unlocked by anyone, including you. Export a backup once you're set up.</p>
    <input type="password" autoFocus placeholder="Create a password (8+ characters)" value={pw} onChange={e=>setPw(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm"/>
    <input type="password" placeholder="Confirm password" value={pw2} onChange={e=>setPw2(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm"/>
   </>:<>
    <p className="text-sm text-slate-400">Enter your password to unlock your profile and resume data.</p>
    <input type="password" autoFocus placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm"/>
   </>}
   {(localError||error)&&<p className="text-xs text-red-400">{localError||error}</p>}
   <button disabled={busy} className="w-full bg-cyan-600 py-2 rounded font-semibold disabled:opacity-50">{busy?"Working...":mode==="setup"?"Create & Unlock":"Unlock"}</button>
   <p className="text-[11px] text-slate-600">This protects data stored in this browser only. It is not an online account and cannot be reset or recovered without the password.</p>
  </form>
 </div>;
}

 return <Block title="Experience">

function Preferences({p,setProfile,notify}){

 <Block title="Career Areas"><div className="grid md:grid-cols-2 gap-2">{categories.map(c=><label key={c} className="bg-slate-900 border border-slate-800 p-3 rounded cursor-pointer text-sm"><input type="checkbox" checked={p.preferences.categories.includes(c)} onChange={()=>setProfile({...p,preferences:{...p.preferences,categories:toggle(p.preferences.categories,c)}})} className="mr-2"/>{c}</label>)}</div></Block>
 <Block title="Target Job Titles"><div className="flex flex-wrap gap-2">{p.preferences.titles.map(t=><span key={t} className="bg-cyan-950 border border-cyan-900 text-cyan-200 px-3 py-1 rounded-full text-xs">{t}<button className="ml-2 text-red-300" onClick={()=>setProfile({...p,preferences:{...p.preferences,titles:p.preferences.titles.filter(x=>x!==t)}})}>×</button></span>)}</div><div className="flex gap-2 mt-4"><input value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="Add job title" className="bg-slate-950 border border-slate-700 rounded p-2 flex-1 text-sm"/><button onClick={()=>{if(newTitle.trim()){setProfile({...p,preferences:{...p.preferences,titles:[...p.preferences.titles,newTitle.trim()]}});setNewTitle("");notify("Job title added.")}}} className="bg-cyan-600 px-3 rounded text-sm">Add</button></div></Block>
 <Block title="Search Guardrails"><p className="text-sm text-slate-400 mb-2">Excluded roles are kept out of your preferred targets.</p><textarea value={p.preferences.excluded.join("\n")} onChange={e=>setProfile({...p,preferences:{...p.preferences,excluded:e.target.value.split("\n").map(x=>x.trim()).filter(Boolean)}})} className="w-full h-24 bg-slate-950 border border-slate-700 rounded p-3 text-sm"/></Block>
 <Block title="Expected Salary"><p className="text-sm text-slate-400 mb-2">Optional. Used only to compare a job's advertised pay against what you're looking for, in the Job Requirements panel. Leave it blank and nothing is assumed.</p><div className="flex items-center gap-2 text-sm"><span className="text-slate-400">Tk</span><input type="number" min="0" step="1000" aria-label="Expected minimum monthly salary" value={p.preferences.expectedSalaryMin??""} onChange={e=>setProfile({...p,preferences:{...p.preferences,expectedSalaryMin:e.target.value===""?null:Math.max(0,Number(e.target.value))}})} placeholder="e.g. 30000" className="bg-slate-950 border border-slate-700 rounded p-2 w-40"/><span className="text-slate-400">per month, minimum</span></div></Block>

function ResumePanel({job,p,updateJob,notify,versions,recordVersion,openApplications,priv,setPriv,privReady,privError,onPrivStartFresh}){
 // The text the pipeline found, unless a fuller post was pasted in the keyword box below.
 const jd=job.pastedDescription!=null?job.pastedDescription:(job.description||"");
 const view={...job,description:jd};
 const recommended=bestFitStrategy(view);
 const [strategy,setStrategy]=useState(()=>job.selectedStrategy||recommended);
 const cfg=ROLE_STRATEGIES[strategy];
 const a=analyzeJob({...view,category:strategy},p);

 // Recruiter keywords: read from the post, then checked against what the profile really says.
 // Choices belong to this one job, so every job's resume is tailored on its own.
 const rk=normalizeDecisions(job.resumeKeywords);
 const setRk=patch=>updateJob(job.id,{resumeKeywords:{...rk,...patch}});
 const evidence=useMemo(()=>keywordEvidence(p),[p]);
 const found=useMemo(()=>extractKeywords(jd,job.title,job.company),[jd,job.title,job.company]);
 const kws=useMemo(()=>annotateKeywords(found,evidence),[found,evidence]);
 const requirements=useMemo(()=>analyzeRequirements(kws,jd,job.title,job,p),[kws,jd,job,p]);
 // Only what you pressed Add for, each slotted into the Master Profile category it actually belongs
 // to (Databases, Software Testing, Legal, ...) rather than dumped in one flat list. A field with no
 // matching category of its own gets a new one, named after that field.
 const addedKw=rk.enabled?pickForResume(kws,rk):[];
 const keyItems=addedKw.map(k=>k.display);
 const skillRows=placeKeywords(p.skills,addedKw);

 // Most relevant experience first (by how many of the post's keywords each entry holds), and within
 // each entry the most relevant bullets first.
 const exp=rankExperience(p.experience,found).map(e=>({...e,bullets:[...e.bullets].filter(Boolean).sort((x,y)=>scoreBullet(y,view,found)-scoreBullet(x,view,found))}));
 const projects=[...p.projects].sort((x,y)=>projectScore(y,strategy,view,found)-projectScore(x,strategy,view,found)).slice(0,3);
 const autoSummary=strategy==="General"?generalSummary(p,job,keyItems):summaryFor(strategy);
 const autoHeadline=p.personal.headline||(strategy==="General"?job.title:cfg.headline);
 const autoExperienceText=exp.map(e=>`${e.role}, ${e.company} — ${[e.location,e.duration].filter(Boolean).join(" | ")}\n${e.bullets.map(b=>"• "+b).join("\n")}`).join("\n\n");
 const autoProjectsText=projects.map(x=>`${x.name}${x.subtitle?", "+x.subtitle:""}\n${x.bullets.filter(Boolean).map(b=>"• "+b).join("\n")}`).join("\n\n");
 const contact=[p.personal.location,p.personal.phone,p.personal.email,p.personal.linkedin,p.personal.github,p.personal.portfolio].filter(Boolean).join(" | ");

 const ov=priv.resumeOverrides||null;
 const finalHeadline=ov?ov.headline:autoHeadline;
 const finalSummary=ov?ov.summary:autoSummary;
 const finalExperienceText=ov?ov.experienceText:autoExperienceText;
 const finalProjectsText=ov?ov.projectsText:autoProjectsText;

 const [editMode,setEditMode]=useState(false);
 const [draft,setDraft]=useState(null);
 const enterEdit=()=>{setDraft({headline:finalHeadline||"",summary:finalSummary,experienceText:finalExperienceText,projectsText:finalProjectsText});setEditMode(true)};
 const saveEdit=()=>{
  setPriv({resumeOverrides:{headline:draft.headline,summary:draft.summary,experienceText:draft.experienceText,projectsText:draft.projectsText}});
  setEditMode(false);notify("Resume edits saved.");
 };
 const resetToAuto=()=>{setPriv({resumeOverrides:null});setEditMode(false);notify("Reverted to the auto-generated resume.")};

 // One plain document holds everything the resume shows. The preview, the PDF, the DOCX, the TXT and the
 // version recorded when you apply are all rendered from it, so they cannot disagree.
 const docFor=rows=>buildResumeDoc({profile:p,headline:finalHeadline,contact,summary:finalSummary,skillRows:rows,experience:exp,projects,
  overridden:!!ov,experienceText:finalExperienceText,projectsText:finalProjectsText});
 const doc=docFor(skillRows);
 const makeText=()=>resumeDocToText(doc);
 // How much of the post's keyword list the finished resume contains, with and without your chosen keywords.
 const coverBefore=keywordCoverage(kws,resumeDocToText(docFor(p.skills)));
 const coverNow=keywordCoverage(kws,resumeDocToText(doc));
 // Application Pack: built from the same keywords, requirements and Add choices as everything above,
 // kept (encrypted, per job) only where you edit it, so a fresh choice or a new post regenerates the rest.
 const pack=buildApplicationPack({profile:p,job,kws,addedKw,text:jd,requirements,coverBefore,coverNow,score:a.score});
 const apSaved=priv.applicationPack||{};
 const setAp=patch=>setPriv({applicationPack:{...apSaved,...patch}});
 const packTexts={
  coverLetter:apSaved.coverLetter!=null?apSaved.coverLetter:pack.coverLetter.text,
  email:apSaved.email!=null?apSaved.email:pack.email.text,
  recruiter:apSaved.recruiter!=null?apSaved.recruiter:pack.recruiter.text
 };
 // Every download carries the same name as the file the Application Pack suggests: resume_company_role_date.
 const fileStem=pack.filename.replace(/\.pdf$/i,"");
 const downloadTxt=()=>download(`${fileStem}.txt`,makeText());
 const downloadPDF=()=>renderResumePDF(doc,`${fileStem}.pdf`);
 const downloadDOCX=()=>renderResumeDOCX(doc,`${fileStem}.docx`);

 // Sent versions: a snapshot of this resume, cover letter, email and keywords exactly as they stand.
 const mine=versionsForJob(versions,job);
 const snapshot=()=>recordVersion({job:{...job,description:jd},doc,strategy,strategyLabel:cfg.label,keywordsAdded:addedKw.map(k=>k.display),
  pack:packTexts,salary:pack.salary,report:pack.report,description:jd,fileName:pack.filename});
 const versionNote=(r,lead)=>!r.ok?`${lead}${lead?" but ":""}${r.message}`
  :r.added?`${lead}${lead?". ":""}Recorded exactly this resume, cover letter, email and keywords. Find it under Applications.`
  :`${lead}${lead?". ":""}Nothing has changed since the version recorded on ${formatDay(r.version.appliedOn)}, so no new one was added.`;
 const recordNow=()=>notify(versionNote(snapshot(),""));
 const markApplied=()=>{
  const r=snapshot();
  updateJob(job.id,{status:"Applied",selectedStrategy:strategy});
  notify(versionNote(r,"Marked Applied"));
 };
 const appliedLike=["Applied","Interview","Rejected","Offer"].includes(job.status);

 const print=()=>window.print();
 const setStatus=status=>{updateJob(job.id,{status,selectedStrategy:strategy});notify(`Status updated to ${status}.`)};
 return <section className="space-y-5">
  {privError&&<div data-testid="private-error" className="no-print bg-red-950/40 border border-red-800 text-red-200 text-xs rounded-lg p-3 flex flex-wrap items-center gap-3"><span className="flex-1 min-w-[240px]">{privError}</span>{!privReady&&<button data-testid="private-start-fresh" onClick={onPrivStartFresh} className="px-3 py-1.5 rounded bg-red-900 text-white">Start fresh</button>}</div>}
  <div className="flex flex-wrap justify-between gap-3"><div><h2 className="text-xl font-bold">Recruiter-Style ATS Resume{ov&&<span className="text-[10px] text-amber-300 font-normal ml-2">(manually edited)</span>}</h2><p className="text-sm text-cyan-400">{job.title} · {job.company}</p><p className="text-xs text-slate-500 mt-1">One-page, single-column, text-first resume layout.</p></div><div className="no-print flex flex-wrap gap-2"><button onClick={()=>editMode?setEditMode(false):enterEdit()} className="bg-amber-600 px-3 py-2 rounded text-xs">{editMode?"Cancel Edit":"Edit Content"}</button><button onClick={downloadTxt} className="bg-slate-800 px-3 py-2 rounded text-xs">TXT</button><button onClick={downloadPDF} className="bg-cyan-600 px-3 py-2 rounded text-xs">Download PDF</button><button onClick={downloadDOCX} className="bg-blue-600 px-3 py-2 rounded text-xs">Download DOCX</button><button onClick={print} className="bg-slate-800 px-3 py-2 rounded text-xs">Print</button></div></div>

  {editMode&&draft&&<div className="no-print bg-slate-900 border border-amber-700 rounded-xl p-5 space-y-3">
   <h3 className="font-semibold text-amber-300">Editing this resume's content</h3>
   <p className="text-xs text-slate-500">Changes here apply only to this job's resume. Core Skills, Education and References always come straight from your Master Profile. Switching strategy below discards unsaved edits.</p>
   <div><label className="text-xs text-slate-400">Headline</label><input value={draft.headline} onChange={e=>setDraft({...draft,headline:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm mt-1"/></div>
   <div><label className="text-xs text-slate-400">Professional Summary</label><textarea value={draft.summary} onChange={e=>setDraft({...draft,summary:e.target.value})} className="w-full h-24 bg-slate-950 border border-slate-700 rounded p-3 text-sm mt-1"/></div>
   <div><label className="text-xs text-slate-400">Professional Experience</label><textarea value={draft.experienceText} onChange={e=>setDraft({...draft,experienceText:e.target.value})} className="w-full h-40 bg-slate-950 border border-slate-700 rounded p-3 text-sm font-mono mt-1"/></div>
   <div><label className="text-xs text-slate-400">Projects</label><textarea value={draft.projectsText} onChange={e=>setDraft({...draft,projectsText:e.target.value})} className="w-full h-32 bg-slate-950 border border-slate-700 rounded p-3 text-sm font-mono mt-1"/></div>
   <div className="flex flex-wrap gap-2"><button onClick={saveEdit} className="bg-emerald-600 px-4 py-2 rounded text-xs">Save Edits</button><button onClick={()=>setEditMode(false)} className="bg-slate-800 px-4 py-2 rounded text-xs">Cancel</button>{ov&&<button onClick={resetToAuto} className="bg-red-900 px-4 py-2 rounded text-xs">Reset to Auto-generated</button>}</div>
  </div>}

  <div className="no-print bg-slate-900 border border-slate-800 rounded-xl p-5"><div className="flex justify-between items-center mb-3"><div><h3 className="font-semibold">Resume Strategy</h3><p className="text-xs text-slate-500">Auto-picked from this job's title and description — pick a different one any time.</p></div><span className="text-xs text-cyan-300">{cfg.label}</span></div><div className="grid md:grid-cols-4 gap-2">{Object.entries(ROLE_STRATEGIES).map(([k,v])=><button key={k} onClick={()=>{setStrategy(k);setEditMode(false);updateJob(job.id,{selectedStrategy:k})}} className={`p-3 rounded-lg border text-left text-xs ${strategy===k?'border-cyan-500 bg-cyan-950/50':'border-slate-800 bg-slate-950'}`}><b>{v.label}</b>{k===recommended&&<span className="ml-1 text-[9px] text-emerald-400">(recommended)</span>}<span className="block text-slate-500 mt-1">{k}</span></button>)}</div></div>
  <RequirementsPanel req={requirements}/>
  <KeywordPanel job={job} jd={jd} kws={kws} rk={rk} setRk={setRk} updateJob={updateJob} coverBefore={coverBefore} coverNow={coverNow} keyCount={addedKw.length}/>
  <div className="grid md:grid-cols-2 gap-4 no-print"><Block title={`Compatibility Analysis: ${a.score}%`}><div className="grid grid-cols-2 gap-2"><Metric label="Title fit" value={a.titleFit}/><Metric label="Level fit" value={a.levelFit}/><Metric label="Skills" value={a.skillFit}/><Metric label="Preference" value={a.prefFit}/></div><p className="text-xs text-emerald-300 mt-3">Matched: {a.matched.slice(0,10).join(", ")||"None"}</p><p className="text-xs text-amber-300 mt-2">Potential gaps: {a.missing.slice(0,8).join(", ")||"None detected"}</p></Block><Block title="ATS Quality"><CheckRow ok text="Single-column, standard section headings"/><CheckRow ok text="No graphics, tables, icons, sidebars, or decorative resume elements"/><CheckRow ok text="Plain-text contact information"/><CheckRow ok={a.missing.length<8} text="Job keywords reviewed without inventing qualifications"/><p className="text-[11px] text-slate-500 mt-3">Compatibility is an internal estimate, not a real employer ATS score.</p></Block></div>
  <ResumePreview doc={doc}/>
  <ApplicationPack job={job} pack={pack} texts={packTexts} saved={apSaved} setAp={setAp} notify={notify}/>
  <div className="no-print space-y-2">
   <div className="flex flex-wrap gap-2 justify-end"><button onClick={()=>setStatus("Saved")} className="bg-slate-800 px-3 py-2 rounded text-xs">Save</button><button onClick={()=>setStatus("Awaiting Approval")} className="bg-amber-600 px-3 py-2 rounded text-xs">Send to Approval</button>{appliedLike&&<button data-testid="record-version" onClick={recordNow} title="Records this resume, cover letter, email and keywords exactly as they are now" className="bg-slate-800 border border-emerald-700 text-emerald-300 px-3 py-2 rounded text-xs">Record current version</button>}<button data-testid="mark-applied" onClick={markApplied} title="Marks the job Applied and records exactly what this resume, cover letter and email say now" className="bg-emerald-600 px-3 py-2 rounded text-xs">Mark Applied</button>{job.url&&<a href={job.url} target="_blank" rel="noopener" className="bg-cyan-700 px-3 py-2 rounded text-xs">Open Job</a>}</div>
   <p data-testid="versions-line" className="text-[11px] text-slate-500 text-right">{mine.length?<>{mine.length} recorded version{mine.length===1?"":"s"} for this job, latest {formatDay(mine[0].appliedOn)}. <button onClick={()=>openApplications(mine[0].id)} className="text-cyan-400 underline">View in Applications</button></>:"Nothing recorded for this job yet. Mark Applied keeps a copy of exactly what this resume, cover letter and email say."}</p>
  </div>
 </section>
}
/* ---- Recruiter keywords (extraction lives in keywords.js) ---- */
const KW_TIERS=[
 ["must","Must-have","Under the post's requirements, or marked required. Recruiters search for these first."],
 ["important","Important","Named in the day-to-day duties."],
 ["nice","Nice to have","Marked preferred, or a plus."]
];
const KW_EVIDENCE={
 skills:{label:"In your profile",cls:"text-emerald-300",pill:"bg-emerald-900/40 text-emerald-200 border-emerald-800"},
 prose:{label:"Only in your experience text",cls:"text-cyan-300",pill:"bg-cyan-950/40 text-cyan-300 border-cyan-700 border-dashed"},
 none:{label:"Not in your profile",cls:"text-amber-300",pill:"bg-slate-900 text-slate-300 border-slate-700"}
};
const kwDecision=(k,rk)=>rk.added.includes(k.key)?"added":rk.skipped.includes(k.key)?"skipped":"undecided";
const kwToggle=(list,key)=>list.includes(key)?list.filter(x=>x!==key):[...list,key];

// One keyword you decide on. Nothing reaches the resume until you press Add.
function KeywordCard({k,rk,onAdd,onSkip}){
 const d=kwDecision(k,rk);
 const grade=k.evidence||"none";
 const ev=KW_EVIDENCE[grade];
 const box={added:"bg-emerald-950/40 border-emerald-700",skipped:"bg-slate-950 border-slate-800 opacity-60",undecided:"bg-slate-950 border-slate-700"}[d];
 return <div data-testid="kw-item" data-key={k.key} data-decision={d} data-evidence={grade} className={"border rounded-lg p-2.5 flex flex-col gap-1.5 "+box}>
  <span className={"text-sm font-medium "+(d==="skipped"?"line-through text-slate-500":"text-slate-100")}>{k.display}{k.source==="mined"&&<span className="opacity-60" title="Found in this post itself, not in the built-in skill list">*</span>}{k.hardRequirement&&<span data-testid="kw-years" title="The post states a specific number of years for this, not just a bare mention" className="ml-1.5 text-[9.5px] px-1.5 py-0.5 rounded border border-amber-700 text-amber-300 bg-amber-950/40 align-middle">{k.yearsRequired}+ yrs</span>}</span>
  <span className={"text-[10.5px] "+ev.cls} data-testid="kw-evidence">{ev.label}{d==="added"&&grade!=="skills"?" · you added it, so keep it only if it is true":""}</span>
  <div className="flex gap-1.5">
   <button type="button" data-testid="kw-add" aria-pressed={d==="added"} onClick={onAdd} className={"px-2.5 py-1 rounded text-[11px] border "+(d==="added"?"bg-emerald-600 border-emerald-500 text-white":"bg-slate-900 border-slate-700 text-slate-200 hover:bg-slate-800")}>{d==="added"?"✓ Added":"Add"}</button>
   <button type="button" data-testid="kw-skip" aria-pressed={d==="skipped"} onClick={onSkip} className={"px-2.5 py-1 rounded text-[11px] border "+(d==="skipped"?"bg-slate-700 border-slate-500 text-white":"bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800")}>{d==="skipped"?"✕ Not added":"Not add"}</button>
  </div>
 </div>
}
// A read-only keyword (degrees in the panel, everything in the Add Job preview).
function KeywordPill({k}){
 const grade=k.evidence||"none";
 return <span data-testid="kw-chip" data-key={k.key} data-state={grade} title={KW_EVIDENCE[grade].label} className={"inline-flex items-center border rounded-full px-2.5 py-1 text-[11px] "+KW_EVIDENCE[grade].pill}>{grade==="skills"&&<span aria-hidden="true" className="mr-1">✓</span>}{k.display}{k.source==="mined"&&<span className="opacity-60">*</span>}</span>
}
function KeywordLegend(){
 return <p className="text-[11px] text-slate-500">
  <span className="text-emerald-300">In your profile</span>: you list it as a skill, a project's tech or a job title. <span className="text-cyan-300">Only in your experience text</span>: a sentence mentions it but no skill line does. <span className="text-amber-300">Not in your profile</span>: it appears nowhere in what you wrote. That note is information for you: you decide, and only what you press Add for reaches the resume. * marks a term read from this post itself.
 </p>
}
/* ---- Job Requirements: eleven groups from analyzeRequirements (keywords.js), read-only ---- */
const REQ_STATE_STYLE={
 match:{cls:"text-emerald-300",dot:"bg-emerald-400"},
 partial:{cls:"text-cyan-300",dot:"bg-cyan-400"},
 gap:{cls:"text-amber-300",dot:"bg-amber-400"},
 unknown:{cls:"text-slate-400",dot:"bg-slate-500"}
};
function ReqCompare({compare}){
 if(!compare)return null;
 const s=REQ_STATE_STYLE[compare.state]||REQ_STATE_STYLE.unknown;
 return <p className={"text-xs flex gap-2 items-start mt-1 "+s.cls} data-testid="req-compare" data-state={compare.state}><span className={"mt-1 w-1.5 h-1.5 rounded-full shrink-0 "+s.dot}/>{compare.note}</p>
}
// A skill-list group (Domain / Certifications / Language). Required/Preferred/Tools stay a one-line
// summary here — their full, decidable list is one scroll down in Recruiter Keywords, so this does
// not repeat it.
function ReqSkillGroup({title,group,hint}){
 if(!group||!group.items.length)return null;
 return <div data-testid={"req-"+title.toLowerCase().replace(/[^a-z]+/g,"-")}>
  <p className="text-xs"><b className="text-slate-200">{title}</b> <span className="text-slate-500">{group.matched} of {group.total} in your profile{hint?" · "+hint:""}</span></p>
  <div className="flex flex-wrap gap-1.5 mt-1.5">{group.items.map(k=><KeywordPill key={k.key} k={k}/>)}</div>
 </div>
}
function RequirementsPanel({req}){
 if(!req)return null;
 const any=req.education||req.experience||req.location||req.salary||req.responsibilities.items.length||req.domain.items.length||req.certifications.items.length||req.language.items.length;
 if(!any)return <div className="no-print bg-slate-900 border border-slate-800 rounded-xl p-5" data-testid="requirements-panel"><h3 className="font-semibold">Job Requirements</h3><p className="text-xs text-slate-500 mt-1">This post didn't say enough to break down — see Recruiter Keywords below for what it does mention.</p></div>;
 return <div className="no-print bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4" data-testid="requirements-panel">
  <div><h3 className="font-semibold">Job Requirements</h3><p className="text-xs text-slate-500 mt-1">What this post actually asks for, compared against your Master Profile. Read-only — decide what goes on the resume in Recruiter Keywords below.</p></div>
  <div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-xs">
   <div className="bg-slate-950 rounded p-2" data-testid="req-required"><p className="text-slate-500">Required</p><p className="font-bold text-lg">{req.required.matched} <span className="text-slate-500 text-xs font-normal">of {req.required.total}</span></p></div>
   <div className="bg-slate-950 rounded p-2" data-testid="req-preferred"><p className="text-slate-500">Preferred</p><p className="font-bold text-lg">{req.preferred.matched} <span className="text-slate-500 text-xs font-normal">of {req.preferred.total}</span></p></div>
   <div className="bg-slate-950 rounded p-2" data-testid="req-tools"><p className="text-slate-500">Tools/Technologies</p><p className="font-bold text-lg">{req.tools.matched} <span className="text-slate-500 text-xs font-normal">of {req.tools.total}</span></p></div>
  </div>
  {req.responsibilities.items.length>0&&<div data-testid="req-responsibilities"><p className="text-xs"><b className="text-slate-200">Responsibilities</b> <span className="text-slate-500">what the role actually involves day to day</span></p><ul className="list-disc ml-4 mt-1.5 text-xs text-slate-300 space-y-0.5">{req.responsibilities.items.map((r,i)=><li key={i}>{r}</li>)}</ul></div>}
  {req.education&&<div data-testid="req-education"><p className="text-xs"><b className="text-slate-200">Education</b> <span className="text-slate-500">{req.education.items.map(k=>k.display).join(", ")}</span></p><ReqCompare compare={req.education.compare}/></div>}
  {req.experience&&<div data-testid="req-experience"><p className="text-xs"><b className="text-slate-200">Experience</b> <span className="text-slate-500">{req.experience.text}</span></p><ReqCompare compare={req.experience.compare}/></div>}
  <ReqSkillGroup title="Domain knowledge" group={req.domain}/>
  <ReqSkillGroup title="Certifications" group={req.certifications}/>
  <ReqSkillGroup title="Language" group={req.language}/>
  {req.location&&<div data-testid="req-location"><p className="text-xs"><b className="text-slate-200">Location</b> <span className="text-slate-500">{req.location.text}{req.location.distanceKm!=null?` · ${req.location.distanceKm} km from your area`:""}</span></p><ReqCompare compare={req.location.compare}/></div>}
  {req.salary&&<div data-testid="req-salary"><p className="text-xs"><b className="text-slate-200">Salary</b> <span className="text-slate-500">{req.salary.text||"not stated"}</span></p><ReqCompare compare={req.salary.compare}/></div>}
 </div>
}
function KeywordPanel({job,jd,kws,rk,setRk,updateJob,coverBefore,coverNow,keyCount}){
 const [all,setAll]=useState(false);
 const addable=kws.filter(k=>k.kind!=="degree");
 const degrees=kws.filter(k=>k.kind==="degree");
 const inProfile=addable.filter(k=>k.evidence==="skills");
 const mustHaves=addable.filter(k=>k.tier==="must");
 const nAdded=addable.filter(k=>rk.added.includes(k.key)).length;
 const nSkipped=addable.filter(k=>rk.skipped.includes(k.key)).length;
 const toggleAdd=k=>setRk({added:kwToggle(rk.added,k.key),skipped:rk.skipped.filter(x=>x!==k.key)});
 const toggleSkip=k=>setRk({skipped:kwToggle(rk.skipped,k.key),added:rk.added.filter(x=>x!==k.key)});
 const addMany=list=>{const keys=list.map(k=>k.key);setRk({added:[...new Set([...rk.added,...keys])],skipped:rk.skipped.filter(x=>!keys.includes(x))})};
 const pct=c=>c.total?Math.round(100*c.found/c.total):0;
 const truncated=KW_TIERS.some(([t])=>addable.filter(k=>k.tier===t).length>12);
 const btn="px-3 py-1.5 rounded text-xs border border-slate-700 bg-slate-950 hover:bg-slate-800 text-slate-200";
 return <div className="no-print bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4" data-testid="keyword-panel">
  <div className="flex flex-wrap justify-between gap-3">
   <div><h3 className="font-semibold">Recruiter Keywords for this job</h3>
    <p className="text-xs text-cyan-400 mt-0.5">{job.title}{job.company?" · "+job.company:""}</p>
    <p className="text-xs text-slate-500 mt-1">Read from this job post, whatever the field. Nothing is on the resume until you press <b className="text-slate-300">Add</b>; <b className="text-slate-300">Not add</b> keeps it off. An added keyword joins the Core Skills category it fits — Databases, Software Testing, Legal, whatever the post calls for — or gets a new category of its own if none fits. Your choices belong to this job's resume only, so every job has its own.</p></div>
   <label className="flex items-center gap-2 text-xs text-slate-300 self-start"><input type="checkbox" data-testid="kw-enabled" checked={rk.enabled} onChange={e=>setRk({enabled:e.target.checked})}/> Add my chosen keywords to Core Skills</label>
  </div>
  {jd.trim().length<200&&<p className="text-xs text-amber-300" data-testid="kw-thin">This post has very little text ({jd.trim().length} characters), so few keywords can be read from it. Open the box at the bottom and paste the full job description.</p>}
  {kws.length===0?<p className="text-sm text-amber-300" data-testid="kw-empty">No recognisable keywords found in this post. Paste the full job description below.</p>:<>
   <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
    <div className="bg-slate-950 rounded p-2"><p className="text-slate-500">Keywords in the post</p><p className="font-bold text-lg" data-testid="kw-total">{addable.length}</p></div>
    <div className="bg-slate-950 rounded p-2"><p className="text-slate-500">Added to this resume</p><p className="font-bold text-lg text-emerald-300" data-testid="kw-added">{nAdded}</p></div>
    <div className="bg-slate-950 rounded p-2"><p className="text-slate-500">Resume keyword match</p><p className="font-bold text-lg" data-testid="kw-cover">{pct(coverBefore)}% <span className="text-slate-500">→</span> <span className="text-cyan-300">{pct(coverNow)}%</span></p></div>
    <div className="bg-slate-950 rounded p-2"><p className="text-slate-500">Must-haves covered</p><p className="font-bold text-lg" data-testid="kw-must">{coverNow.mustFound} of {coverNow.mustTotal}</p></div>
   </div>
   <div className="flex flex-wrap items-center gap-2">
    <button type="button" data-testid="kw-add-mine" onClick={()=>addMany(inProfile)} disabled={!inProfile.length} className={btn+(inProfile.length?"":" opacity-40 cursor-not-allowed")}>Add all in my profile ({inProfile.length})</button>
    <button type="button" data-testid="kw-add-must" onClick={()=>addMany(mustHaves)} disabled={!mustHaves.length} className={btn+(mustHaves.length?"":" opacity-40 cursor-not-allowed")}>Add all must-haves ({mustHaves.length})</button>
    <button type="button" data-testid="kw-clear" onClick={()=>setRk({added:[],skipped:[]})} className={btn}>Clear all choices</button>
    <span className="text-xs text-slate-500" data-testid="kw-counts">{nAdded} added · {nSkipped} not added · {addable.length-nAdded-nSkipped} still to decide</span>
   </div>
   {keyCount>15&&<p className="text-xs text-amber-300" data-testid="kw-long">{keyCount} keywords are added so far. Recruiters skim about 10 to 15 in Core Skills, so consider Not add for the weakest.</p>}
   <div className="space-y-4">{KW_TIERS.map(([tier,label,hint])=>{
    const list=addable.filter(k=>k.tier===tier);
    if(!list.length)return null;
    const shown=all?list:list.slice(0,12);
    return <div key={tier} data-testid={"kw-tier-"+tier}>
     <p className="text-xs"><b className="text-slate-200">{label}</b> <span className="text-slate-500">({list.length}) {hint}</span></p>
     <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 mt-2">{shown.map(k=><KeywordCard key={k.key} k={k} rk={rk} onAdd={()=>toggleAdd(k)} onSkip={()=>toggleSkip(k)}/>)}</div>
     {list.length>shown.length&&<p className="text-[11px] text-slate-500 mt-1">+{list.length-shown.length} more in this group</p>}
    </div>})}</div>
   {truncated&&<button type="button" onClick={()=>setAll(!all)} className="text-xs text-cyan-400 underline">{all?"Show fewer":"Show every keyword"}</button>}
   {degrees.length>0&&<div data-testid="kw-degrees"><p className="text-xs"><b className="text-slate-200">Education the post asks for</b> <span className="text-slate-500">Your Education section shows these; they are never added to Core Skills.</span></p><div className="flex flex-wrap gap-1.5 mt-1.5">{degrees.map(k=><KeywordPill key={k.key} k={k}/>)}</div></div>}
   <KeywordLegend/>
  </>}
  <details className="text-xs" data-testid="kw-jd-box">
   <summary className="cursor-pointer text-cyan-300">Paste or edit the full job description ({jd.length.toLocaleString()} characters)</summary>
   <p className="text-slate-500 mt-2">Copy the whole post from the job site and paste it here. The keywords, the recommended resume strategy and the match score all update.</p>
   <textarea data-testid="kw-jd" value={jd} onChange={e=>updateJob(job.id,{pastedDescription:e.target.value})} className="w-full h-48 bg-slate-950 border border-slate-700 rounded p-3 mt-2 text-xs"/>
   {job.pastedDescription!=null&&<button onClick={()=>updateJob(job.id,{pastedDescription:undefined})} className="mt-2 text-amber-300 underline">Restore the original text</button>}
  </details>
 </div>
}
// Shown under the description box on Add Job, before the job is even saved.
function KeywordPreview({title,company,text,p}){
 const deferred=React.useDeferredValue(text);
 const evidence=useMemo(()=>keywordEvidence(p),[p]);
 const kws=useMemo(()=>deferred&&deferred.trim().length>=40?annotateKeywords(extractKeywords(deferred,title,company),evidence):[],[deferred,title,company,evidence]);
 if(!kws.length)return null;
 const mine=kws.filter(k=>k.kind!=="degree"&&k.evidence==="skills").length;
 return <div className="border border-slate-800 rounded-lg p-4 space-y-3 bg-slate-950/40" data-testid="keyword-preview">
  <p className="text-sm"><b>{kws.length} recruiter keywords</b> found in this post, <span className="text-emerald-300">{mine} already in your profile</span>. After adding the job, open its resume and press Add for the ones you want on it.</p>
  {KW_TIERS.map(([tier,label])=>{const list=kws.filter(k=>k.tier===tier);return list.length?<div key={tier}><p className="text-xs text-slate-400">{label} ({list.length})</p><div className="flex flex-wrap gap-1.5 mt-1">{list.slice(0,18).map(k=><KeywordPill key={k.key} k={k}/>)}{list.length>18&&<span className="text-[11px] text-slate-500 self-center">+{list.length-18} more</span>}</div></div>:null})}
  <KeywordLegend/>
 </div>
}
/* ---- Application Pack (generation lives in applypack.js). Nothing here sends anything anywhere. ---- */
function fallbackCopy(text,done){
 const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";
 document.body.appendChild(t);t.select();
 try{document.execCommand("copy");done()}catch(e){}
 document.body.removeChild(t);
}
function copyText(text,notify,label){
 const done=()=>notify&&notify((label||"Text")+" copied.");
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));
 else fallbackCopy(text,done);
}
const PACK_STATE={done:{icon:"✓",cls:"text-emerald-300"},todo:{icon:"○",cls:"text-amber-300"},info:{icon:"•",cls:"text-slate-400"},warn:{icon:"!",cls:"text-red-300"}};
const packBtn="px-2.5 py-1 rounded text-[11px] border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-200";

function PackPart({id,label,generated,value,setValue,resetValue,counter,rows,notify}){
 const edited=value!==generated;
 const left=apCountPlaceholders(value);
 return <div data-testid={"pack-"+id} className="space-y-1.5">
  <div className="flex flex-wrap items-center justify-between gap-2">
   <p className="text-xs"><b className="text-slate-200">{label}</b> <span className={"ml-1 "+counter.cls} data-testid={"pack-"+id+"-count"}>{counter.text}</span>{left>0&&<span className="ml-2 text-amber-300" data-testid={"pack-"+id+"-left"}>{left} [EDIT THIS] left</span>}{edited&&<span className="ml-2 text-cyan-300" data-testid={"pack-"+id+"-edited"}>edited</span>}</p>
   <div className="flex gap-1.5">
    <button type="button" data-testid={"pack-"+id+"-copy"} onClick={()=>copyText(value,notify,label)} className={packBtn}>Copy</button>
    {edited&&<button type="button" data-testid={"pack-"+id+"-reset"} onClick={resetValue} className={packBtn}>Reset to generated</button>}
   </div>
  </div>
  <textarea data-testid={"pack-"+id+"-text"} aria-label={label} rows={rows} value={value} onChange={e=>setValue(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-xs leading-5"/>
 </div>
}
function ApplicationPack({job,pack,texts,saved,setAp,notify}){
 const rep=pack.report;
 const bodyWords=coverLetterBodyWords(texts.coverLetter);
 const okWords=bodyWords>=120&&bodyWords<=180;
 const recChars=texts.recruiter.length;
 const checklist=buildChecklist({job,texts,docs:pack.docs,filename:pack.filename,needsCoverLetter:pack.needsCoverLetter,applyEmail:pack.applyEmail});
 const reset=key=>()=>setAp({[key]:undefined});
 return <div className="no-print bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-5" data-testid="application-pack">
  <div><h3 className="font-semibold">Application Pack</h3>
   <p className="text-xs text-cyan-400 mt-0.5">{job.title}{job.company?" · "+job.company:""}</p>
   <p className="text-xs text-slate-500 mt-1">Built from your Master Profile and this post. Every line is your own fact, a quote from the post, or an <b className="text-slate-300">[EDIT THIS]</b> where only you know the answer. <b className="text-slate-300">Nothing is sent for you</b>: read it, copy it, send it yourself.</p></div>

  <div className="bg-slate-950 rounded-lg p-3 space-y-2 text-xs" data-testid="pack-report">
   <p><b className="text-slate-200">Keywords added</b> {rep.keywordsAdded.length?<span data-testid="pack-added" className="text-emerald-300">{rep.keywordsAdded.join(", ")}</span>:<span className="text-slate-500" data-testid="pack-added">none yet: press Add in Recruiter Keywords above</span>}</p>
   <div><p><b className="text-slate-200">Important gaps</b></p>{rep.gaps.length?<ul className="list-disc ml-4 mt-1 text-amber-200 space-y-0.5" data-testid="pack-gaps">{rep.gaps.map((g,i)=><li key={i}>{g}</li>)}</ul>:<p className="text-slate-500 mt-1" data-testid="pack-gaps">None found in the requirements this post states.</p>}</div>
   <p data-testid="pack-match"><b className="text-slate-200">Estimated match</b> before <b>{rep.matchBefore}/100</b> → after <b className="text-cyan-300">{rep.matchAfter}/100</b> <span className="text-slate-500">(keyword coverage of your resume, not an employer's score)</span>{rep.roleFit!=null&&<span className="text-slate-400"> · role fit {rep.roleFit}/100</span>}</p>
  </div>

  <div data-testid="pack-salary" className="text-xs">
   <p><b className="text-slate-200">Expected salary field</b> {pack.salary.amount!=null&&<><b className="text-cyan-300" data-testid="pack-salary-amount">{pack.salary.amount.toLocaleString("en-US")} Tk</b> <button type="button" data-testid="pack-salary-copy" onClick={()=>copyText(String(pack.salary.amount),notify,"Salary")} className={packBtn+" ml-1"}>Copy</button></>}</p>
   <p className="text-slate-400 mt-0.5" data-testid="pack-salary-note">{pack.salary.note}</p>
  </div>

  <PackPart id="cover" label="Cover letter" generated={pack.coverLetter.text} value={texts.coverLetter} setValue={v=>setAp({coverLetter:v})} resetValue={reset("coverLetter")} rows={17} notify={notify}
   counter={{text:`${bodyWords} words (target 120-180)`,cls:okWords?"text-emerald-300":"text-amber-300"}}/>
  {pack.coverLetter.notes.length>0&&texts.coverLetter===pack.coverLetter.text&&<ul className="text-[11px] text-slate-500 list-disc ml-4" data-testid="pack-cover-notes">{pack.coverLetter.notes.map((n,i)=><li key={i}>{n}</li>)}</ul>}
  <PackPart id="email" label="Email draft" generated={pack.email.text} value={texts.email} setValue={v=>setAp({email:v})} resetValue={reset("email")} rows={15} notify={notify}
   counter={{text:`${apWords(texts.email)} words`,cls:"text-slate-400"}}/>
  <PackPart id="recruiter" label="Recruiter / LinkedIn message" generated={pack.recruiter.text} value={texts.recruiter} setValue={v=>setAp({recruiter:v})} resetValue={reset("recruiter")} rows={4} notify={notify}
   counter={{text:`${recChars} of 300 characters`,cls:recChars<=300?"text-emerald-300":"text-amber-300"}}/>

  <div data-testid="pack-checklist"><p className="text-xs"><b className="text-slate-200">Checklist</b></p>
   <ul className="mt-1.5 space-y-1">{checklist.map(i=>{const s=PACK_STATE[i.state];return <li key={i.key} data-testid={"check-"+i.key} data-state={i.state} className="text-xs flex gap-2 items-start"><span className={"w-4 shrink-0 text-center "+s.cls}>{s.icon}</span><span><span className="text-slate-200">{i.label}</span> <span className="text-slate-500">{i.note}</span></span></li>})}</ul>
  </div>

  <div className="flex flex-wrap items-center gap-2 text-xs" data-testid="pack-file">
   <span className="text-slate-400">Suggested file name</span><code className="bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-200" data-testid="pack-filename">{pack.filename}</code>
   <button type="button" data-testid="pack-filename-copy" onClick={()=>copyText(pack.filename,notify,"File name")} className={packBtn}>Copy</button>
   {job.url&&<a href={job.url} target="_blank" rel="noopener noreferrer" className={packBtn+" text-cyan-300"} data-testid="pack-open">Open application page</a>}
  </div>
 </div>
}
function ResumeSection({title,children}){return <section className="mb-4"><h2 className="text-[10.5px] tracking-widest font-bold border-b border-black pb-1 mb-2">{title}</h2>{children}</section>}
