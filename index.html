/* Password-derived encryption for the profile only (name, contact links,
   resume content). Job listings stay unencrypted so review.html keeps
   working without a password prompt — they're public postings, not personal
   data. There is no recovery: losing the password means the vault cannot be
   decrypted by anyone, which is the point. */
function bufToB64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function b64ToBuf(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}
async function deriveKey(password,saltB64){
 const salt=saltB64?b64ToBuf(saltB64):crypto.getRandomValues(new Uint8Array(16));
 const keyMaterial=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},keyMaterial,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
 return {key,saltB64:bufToB64(salt)};
}
async function encryptJSON(key,obj){
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const data=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));
 return {iv:bufToB64(iv),data:bufToB64(data)};
}
async function decryptJSON(key,ivB64,dataB64){
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBuf(ivB64)},key,b64ToBuf(dataB64));
 return JSON.parse(new TextDecoder().decode(plain));
}

function migrateProfile(raw){
 if(!raw||typeof raw!=="object")return null;
 const p={...raw};
 p.personal={...DEFAULT_PROFILE.personal,...(raw.personal||{})};
 p.education=(raw.education||[]).map(e=>({
  degree:e.degree||"",
  institution:e.institution||"",
  score:e.score||e.cgpa||"",
  date:e.date||e.graduation||""
 }));
 p.experience=(raw.experience||[]).map(e=>({role:e.role||"",company:e.company||"",location:e.location||"",duration:e.duration||"",bullets:e.bullets||[],tags:e.tags||[]}));
 p.projects=(raw.projects||[]).map(x=>({
  name:x.name||"",
  subtitle:x.subtitle||"",
  bullets:x.subtitle!==undefined&&x.subtitle!==""?(x.bullets||[]):[x.description,...(x.bullets||[])].filter(Boolean),
  skills:x.skills||[],
  categories:x.categories||[]
 }));
 if(Array.isArray(raw.skills)){
  p.skills=raw.skills.map(g=>({category:g.category||"",items:g.items||[]}));
 }else if(raw.skills&&typeof raw.skills==="object"){
  const labels={technical:"Technical",testing:"Software Testing",tools:"Tools",systems:"Systems",soft:"Soft Skills"};
  p.skills=Object.entries(raw.skills).map(([k,v])=>({category:labels[k]||k,items:v||[]}));
 }else{
  p.skills=[];
 }
 p.references=raw.references||[];
 const saved=raw.preferences||{};
 p.preferences={...DEFAULT_PROFILE.preferences,...saved};
 if((saved.version||1)<2){
  // Version 1 only targeted QA/MIS roles. Widen it once to CSE, management-trainee and business
  // roles, keeping everything the user already chose.
  const union=(a,b)=>[...a,...b.filter(x=>!a.some(y=>String(y).toLowerCase()===x.toLowerCase()))];
  const oldDefaultExcluded=["Senior Software Developer","Backend Developer","Full Stack Developer"];
  const excludedUntouched=Array.isArray(saved.excluded)&&saved.excluded.length===oldDefaultExcluded.length&&oldDefaultExcluded.every(x=>saved.excluded.includes(x));
  p.preferences={
   ...p.preferences,
   categories:union(p.preferences.categories,DEFAULT_PROFILE.preferences.categories),
   titles:union(p.preferences.titles,DEFAULT_PROFILE.preferences.titles),
   excluded:excludedUntouched||!saved.excluded?DEFAULT_PROFILE.preferences.excluded:p.preferences.excluded,
   version:2
  };
 }
 return p;
}

const stopWords=new Set(("and or the a an to of in for with on at from by is are be as this that will can should experience knowledge skills skill requirements responsible preferred plus using use ability excellent strong good candidate job role position company years year").split(" "));
function normalize(s){return (s||"").toLowerCase().replace(/[^a-z0-9+#./ ]/g," ")}
function terms(s){return [...new Set(normalize(s).split(/\s+/).filter(x=>x.length>2&&!stopWords.has(x)))]}
function allEvidence(p){
 return [
 ...p.skills.flatMap(g=>g.items),
 ...p.experience.flatMap(x=>[x.role,x.company,...x.bullets]),
 ...p.projects.flatMap(x=>[x.name,x.subtitle||"",...(x.skills||[]),...x.bullets])
 ].join(" ").toLowerCase()
}
function analyzeJob(job,p){
 const text=[job.title,job.description,job.requiredSkills||""].join(" ");
 const raw=terms(text);
 const evidence=allEvidence(p);
 const matched=raw.filter(t=>evidence.includes(t));
 const missing=raw.filter(t=>!evidence.includes(t)).slice(0,12);
 const skillPct=raw.length?Math.round((matched.length/raw.length)*100):0;
 const titlePref=p.preferences.titles.some(x=>normalize(job.title).includes(normalize(x))||normalize(x).includes(normalize(job.title)));
 const cat=(job.category||"").toLowerCase();
 const relevantExp=p.experience.filter(x=>[x.role,...x.tags].join(" ").toLowerCase().includes(cat)).length;
 const projectHits=p.projects.filter(x=>x.categories.some(c=>c.toLowerCase()===cat)||normalize([x.name,x.subtitle||"",...(x.skills||[]),...x.bullets].join(" ")).split(" ").some(t=>raw.includes(t))).length;
 const expScore=Math.min(100,relevantExp?85:45);
 const projectScore=Math.min(100,projectHits*35);
 const prefScore=titlePref||p.preferences.categories.some(c=>c.toLowerCase()===cat)?100:40;
 const score=Math.round(skillPct*.35+expScore*.25+100*.15+projectScore*.15+prefScore*.10);
 return {score,skillPct,matched:[...new Set(matched)].slice(0,15),missing:[...new Set(missing)],expScore,projectScore,prefScore}
}

"Software Quality Assurance":"Computer Science and Engineering graduate with hands-on Software Quality Assurance internship experience in manual, functional and regression testing of web applications. Experienced in UI verification, form validation, responsive and cross-browser testing, defect documentation, fix verification, and collaboration with development and project teams.",

"Data & Reporting":"Computer Science and Engineering graduate with practical database experience in Oracle and MySQL, SQL queries, database design, data integrity, data management, and analytical problem solving."};return m[strategy]||m["Information Systems"]}
function scoreBullet(b,job){return terms([job.title,job.description].join(" ")).filter(t=>normalize(b).includes(t)).length}
function projectScore(x,strategy,job){return (x.categories.includes(strategy)?20:0)+terms([job.title,job.description].join(" ")).filter(t=>normalize([x.name,x.subtitle||"",...(x.skills||[]),...x.bullets].join(" ")).includes(t)).length}
function hasPhrase(text,phrase){
 const p=normalize(phrase).trim();
 if(!p)return false;
 const esc=p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
 // Short keys ("mis", "mba") must be whole words; longer ones only need to start a word so plurals match.
 return new RegExp("(^|[^a-z0-9])"+esc+(p.length<=4?"($|[^a-z0-9])":"")).test(text);
}
function bestFitStrategy(job){
 const text=normalize([job.title,job.description].join(" "));
 const fallback=job.category&&ROLE_STRATEGIES[job.category]?job.category:"Information Systems";
 let best=fallback,bestScore=0;
 for(const [key,cfg] of Object.entries(ROLE_STRATEGIES)){
  const s=(cfg.keywords||[]).filter(k=>hasPhrase(text,k)).length;
  if(s>bestScore){bestScore=s;best=key;}
 }
 return best;
}

function download(filename,content,type="text/plain"){
 const blob=new Blob([content],{type}); downloadBlob(filename,blob);
}
function downloadBlob(filename,blob){
 const u=URL.createObjectURL(blob); const a=document.createElement("a");a.href=u;a.download=filename;a.click();URL.revokeObjectURL(u);
}
function csvEscape(v){return `"${String(v??"").replaceAll('"','""')}"`}

 const [search,setSearch]=useState("");
 const [profileText,setProfileText]=useState("");

 useEffect(()=>{
  if(!cryptoKey||!profile)return;
  (async()=>{
   const enc=await encryptJSON(cryptoKey,profile);
   const vault=JSON.parse(localStorage.getItem(VAULT_KEY)||"{}");
   localStorage.setItem(VAULT_KEY,JSON.stringify({...vault,iv:enc.iv,data:enc.data}));
  })();
 },[profile,cryptoKey]);
 useEffect(()=>localStorage.setItem(JOB_KEY,JSON.stringify(jobs)),[jobs]);
 const notify=m=>{setToast(m);setTimeout(()=>setToast(""),3500)};
 const createVault=async password=>{
  const {key,saltB64}=await deriveKey(password);
  const existing=migrateProfile(JSON.parse(localStorage.getItem(STORAGE_KEY)||"null"));
  const initial=existing||DEFAULT_PROFILE;
  const enc=await encryptJSON(key,initial);
  localStorage.setItem(VAULT_KEY,JSON.stringify({salt:saltB64,iv:enc.iv,data:enc.data}));
  localStorage.removeItem(STORAGE_KEY);
  setCryptoKey(key);setProfile(initial);setVaultStatus("unlocked");
  if(existing)notify("Existing profile data in this browser was encrypted with your new password.");
 };
 const unlockVault=async password=>{
  setLockError("");
  try{
   const vault=JSON.parse(localStorage.getItem(VAULT_KEY));
   const {key}=await deriveKey(password,vault.salt);
   const decrypted=await decryptJSON(key,vault.iv,vault.data);
   setCryptoKey(key);setProfile(migrateProfile(decrypted)||DEFAULT_PROFILE);setVaultStatus("unlocked");
  }catch(e){setLockError("Incorrect password.");}
 };
 const lockVault=()=>{setCryptoKey(null);setProfile(null);setVaultStatus("locked");setTab("dashboard");};
 // Hooks must run unconditionally on every render, so this stays above the
 // early return below (which only happens while locked/setting up) — moving
 // it after that return caused React to see a different hook count between
 // the locked and unlocked renders and silently fail to render anything.
 const stats=useMemo(()=>{
  if(!profile)return{total:0,strong:0,review:0,applied:0};
  const scores=jobs.map(j=>analyzeJob(j,profile).score);

 },[jobs,profile]);
 if(vaultStatus!=="unlocked"){
  return <LockScreen mode={vaultStatus} onCreate={createVault} onUnlock={unlockVault} error={lockError}/>;
 }

  setSelected(prev=>prev&&prev.id===id?{...prev,...patch}:prev);
 };

  try{const obj=migrateProfile(JSON.parse(profileText));setProfile(obj);setEditing(false);notify("Profile saved successfully.");}
  catch(e){alert("Invalid JSON. Please correct the profile data.");}

function LockScreen({mode,onCreate,onUnlock,error}){
 const [pw,setPw]=useState("");
 const [pw2,setPw2]=useState("");
 const [busy,setBusy]=useState(false);
 const [localError,setLocalError]=useState("");
 const submit=async e=>{
  e.preventDefault();
  setLocalError("");
  if(mode==="setup"){
   if(pw.length<8){setLocalError("Use at least 8 characters.");return;}
   if(pw!==pw2){setLocalError("Passwords do not match.");return;}
   setBusy(true);await onCreate(pw);setBusy(false);
  }else{
   if(!pw){setLocalError("Enter your password.");return;}
   setBusy(true);await onUnlock(pw);setBusy(false);
  }
 };
 return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-slate-100 p-4">
  <form onSubmit={submit} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm space-y-4">
   <div><h1 className="font-bold text-lg">CareerPilot BD</h1><p className="text-xs text-cyan-400">Multi-Career Job Search & Truthful ATS Resume Engine</p></div>
   {mode==="setup"?<>
    <p className="text-sm text-slate-400">Set a password to encrypt your profile and resume data in this browser (AES-256, derived with PBKDF2). There is no recovery — if you forget it, this data cannot be unlocked by anyone, including you. Export a backup once you're set up.</p>
    <input type="password" autoFocus placeholder="Create a password (8+ characters)" value={pw} onChange={e=>setPw(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm"/>
    <input type="password" placeholder="Confirm password" value={pw2} onChange={e=>setPw2(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm"/>
   </>:<>
    <p className="text-sm text-slate-400">Enter your password to unlock your profile and resume data.</p>
    <input type="password" autoFocus placeholder="Password" value={pw} onChange={e=>setPw(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm"/>
   </>}
   {(localError||error)&&<p className="text-xs text-red-400">{localError||error}</p>}
   <button disabled={busy} className="w-full bg-cyan-600 py-2 rounded font-semibold disabled:opacity-50">{busy?"Working...":mode==="setup"?"Create & Unlock":"Unlock"}</button>
   <p className="text-[11px] text-slate-600">This protects data stored in this browser only. It is not an online account and cannot be reset or recovered without the password.</p>
  </form>
 </div>;
}

function ResumePanel({job,p,updateJob,notify}){
 const recommended=bestFitStrategy(job);
 const [strategy,setStrategy]=useState(()=>job.selectedStrategy||recommended);
 const cfg=ROLE_STRATEGIES[strategy];
 const a=analyzeJob({...job,category:strategy},p);
 const exp=[...p.experience].map(e=>({...e,bullets:[...e.bullets].filter(Boolean).sort((x,y)=>scoreBullet(y,job)-scoreBullet(x,job))}));
 const projects=[...p.projects].sort((x,y)=>projectScore(y,strategy,job)-projectScore(x,strategy,job)).slice(0,3);
 const autoSummary=summaryFor(strategy);
 const autoHeadline=p.personal.headline||cfg.headline;
 const autoExperienceText=exp.map(e=>`${e.role}, ${e.company} — ${[e.location,e.duration].filter(Boolean).join(" | ")}\n${e.bullets.map(b=>"• "+b).join("\n")}`).join("\n\n");
 const autoProjectsText=projects.map(x=>`${x.name}${x.subtitle?", "+x.subtitle:""}\n${x.bullets.filter(Boolean).map(b=>"• "+b).join("\n")}`).join("\n\n");
 const contact=[p.personal.location,p.personal.phone,p.personal.email,p.personal.linkedin,p.personal.github,p.personal.portfolio].filter(Boolean).join(" | ");

 const ov=job.resumeOverrides||null;
 const finalHeadline=ov?ov.headline:autoHeadline;
 const finalSummary=ov?ov.summary:autoSummary;
 const finalExperienceText=ov?ov.experienceText:autoExperienceText;
 const finalProjectsText=ov?ov.projectsText:autoProjectsText;

 const [editMode,setEditMode]=useState(false);
 const [draft,setDraft]=useState(null);
 const enterEdit=()=>{setDraft({headline:finalHeadline||"",summary:finalSummary,experienceText:finalExperienceText,projectsText:finalProjectsText});setEditMode(true)};
 const saveEdit=()=>{
  updateJob(job.id,{resumeOverrides:{headline:draft.headline,summary:draft.summary,experienceText:draft.experienceText,projectsText:draft.projectsText}});
  setEditMode(false);notify("Resume edits saved.");
 };
 const resetToAuto=()=>{updateJob(job.id,{resumeOverrides:null});setEditMode(false);notify("Reverted to the auto-generated resume.")};

 const fileBase=()=>`${(p.personal.fullName||"Resume").replace(/\s+/g,"_")}_${strategy.replace(/\W+/g,"_")}`;
 const skillsLines=p.skills.map(g=>`${g.category}: ${g.items.filter(Boolean).join(", ")}`).join("\n");
 const educationLines=p.education.map(e=>`${e.degree}${e.date?" | "+e.date:""}\n${[e.institution,e.score].filter(Boolean).join(" | ")}`).join("\n\n");
 const referenceLines=(p.references||[]).filter(r=>r.name).map(r=>`${r.name}\n${r.title}\n${[r.email,r.phone].filter(Boolean).join(" | ")}`).join("\n\n");

 const makeText=()=>`${(p.personal.fullName||"Your Name").toUpperCase()}\n${finalHeadline?finalHeadline.toUpperCase()+"\n":""}${contact}\n\nPROFESSIONAL SUMMARY\n${finalSummary}\n\nCORE SKILLS\n${skillsLines}\n\nPROFESSIONAL EXPERIENCE\n${finalExperienceText}\n\nPROJECTS\n${finalProjectsText}\n\nEDUCATION\n${educationLines}${referenceLines?`\n\nREFERENCES\n${referenceLines}`:""}`;
 const downloadTxt=()=>download(`${fileBase()}.txt`,makeText());

 const downloadPDF=()=>{
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"a4"});
  const pageWidth=doc.internal.pageSize.getWidth(), pageHeight=doc.internal.pageSize.getHeight();
  const marginX=42, maxWidth=pageWidth-marginX*2, marginBottom=48;
  let y=52;
  const ensureSpace=(lineHeight=12)=>{if(y+lineHeight>pageHeight-marginBottom){doc.addPage();y=50;}};
  const writeBlock=(text,size=9.5,lineHeight=12)=>{
   doc.setFont("helvetica","normal");doc.setFontSize(size);
   String(text||"").split("\n").forEach(para=>{
    if(!para){ensureSpace(lineHeight/2);y+=lineHeight/2;return;}
    doc.splitTextToSize(para,maxWidth).forEach(line=>{ensureSpace(lineHeight);doc.text(line,marginX,y);y+=lineHeight;});
   });
  };
  const writeTwoCol=(left,right,size=10.2)=>{
   ensureSpace(13);
   doc.setFont("helvetica","bold");doc.setFontSize(size);
   doc.text(left,marginX,y);
   if(right){doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(right,marginX+maxWidth,y,{align:"right"});}
   y+=13;
  };
  const sectionTitle=title=>{
   ensureSpace(20);
   doc.setFont("helvetica","bold");doc.setFontSize(10.5);
   doc.text(title.toUpperCase(),marginX,y);y+=4;
   doc.setLineWidth(0.75);doc.line(marginX,y,marginX+maxWidth,y);y+=12;
  };
  doc.setFont("helvetica","bold");doc.setFontSize(19);
  doc.text((p.personal.fullName||"YOUR NAME").toUpperCase(),marginX,y);y+=16;
  if(finalHeadline){doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(finalHeadline.toUpperCase(),marginX,y);y+=13;}
  doc.setFont("helvetica","normal");doc.setFontSize(9);
  doc.text(contact||" ",marginX,y);y+=16;

  sectionTitle("Professional Summary");writeBlock(finalSummary);y+=8;

  sectionTitle("Core Skills");
  p.skills.forEach(g=>writeBlock(`${g.category}: ${g.items.filter(Boolean).join(", ")}`));
  y+=8;

  sectionTitle("Professional Experience");
  if(ov){writeBlock(finalExperienceText);}
  else{exp.forEach(e=>{writeTwoCol(`${e.role}, ${e.company}`,[e.location,e.duration].filter(Boolean).join(" | "));e.bullets.forEach(b=>writeBlock("• "+b));y+=4;});}
  y+=4;

  sectionTitle("Projects");
  if(ov){writeBlock(finalProjectsText);}
  else{projects.forEach(x=>{ensureSpace(13);doc.setFont("helvetica","bold");doc.setFontSize(10.2);doc.text(x.name+(x.subtitle?`, ${x.subtitle}`:""),marginX,y);y+=13;x.bullets.filter(Boolean).forEach(b=>writeBlock("• "+b));y+=4;});}
  y+=4;

  sectionTitle("Education");
  p.education.forEach(e=>{writeTwoCol(e.degree,e.date);writeBlock([e.institution,e.score].filter(Boolean).join(" | "));y+=4;});

  const refs=(p.references||[]).filter(r=>r.name);
  if(refs.length){
   y+=4;sectionTitle("References");
   refs.forEach(r=>{
    ensureSpace(12);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(r.name,marginX,y);y+=12;
    writeBlock(r.title,9);
    writeBlock([r.email,r.phone].filter(Boolean).join(" | "),9);
    y+=6;
   });
  }
  doc.save(`${fileBase()}.pdf`);
 };

 const downloadDOCX=async()=>{
  const {Document,Packer,Paragraph,TextRun,TabStopType,TabStopPosition}=window.docx;
  const para=(text,opts={})=>new Paragraph({spacing:{after:opts.after??60},children:[new TextRun({text,bold:!!opts.bold,size:opts.size||20})]});
  const heading=text=>new Paragraph({spacing:{before:220,after:80},border:{bottom:{color:"000000",space:1,style:"single",size:6}},children:[new TextRun({text:text.toUpperCase(),bold:true,size:20})]});
  const bodyLines=text=>String(text||"").split("\n").map(line=>new Paragraph({spacing:{after:40},children:[new TextRun({text:line||" ",size:18})]}));
  const twoCol=(l,r)=>new Paragraph({tabStops:[{type:TabStopType.RIGHT,position:TabStopPosition.MAX}],spacing:{after:20},children:[new TextRun({text:l,bold:true,size:20}),new TextRun({text:"\t"+(r||""),size:18})]});

  const children=[para(p.personal.fullName?p.personal.fullName.toUpperCase():"YOUR NAME",{bold:true,size:32,after:40})];
  if(finalHeadline)children.push(para(finalHeadline.toUpperCase(),{bold:true,size:20,after:40}));
  children.push(para(contact||" ",{size:16,after:200}));

  children.push(heading("Professional Summary"),...bodyLines(finalSummary));

  children.push(heading("Core Skills"));
  p.skills.forEach(g=>children.push(new Paragraph({spacing:{after:40},children:[new TextRun({text:`${g.category}: `,bold:true,size:18}),new TextRun({text:g.items.filter(Boolean).join(", "),size:18})]})));

  children.push(heading("Professional Experience"));
  if(ov){children.push(...bodyLines(finalExperienceText));}
  else{exp.forEach(e=>{
   children.push(twoCol(`${e.role}, ${e.company}`,[e.location,e.duration].filter(Boolean).join(" | ")));
   e.bullets.forEach(b=>children.push(new Paragraph({spacing:{after:30},children:[new TextRun({text:"• "+b,size:18})]})));
  });}

  children.push(heading("Projects"));
  if(ov){children.push(...bodyLines(finalProjectsText));}
  else{projects.forEach(x=>{
   children.push(new Paragraph({spacing:{after:20},children:[new TextRun({text:x.name+(x.subtitle?`, ${x.subtitle}`:""),bold:true,size:20})]}));
   x.bullets.filter(Boolean).forEach(b=>children.push(new Paragraph({spacing:{after:30},children:[new TextRun({text:"• "+b,size:18})]})));
  });}

  children.push(heading("Education"));
  p.education.forEach(e=>{
   children.push(twoCol(e.degree,e.date));
   children.push(new Paragraph({spacing:{after:60},children:[new TextRun({text:[e.institution,e.score].filter(Boolean).join(" | "),size:18})]}));
  });

  const refs=(p.references||[]).filter(r=>r.name);
  if(refs.length){
   children.push(heading("References"));
   refs.forEach(r=>{
    children.push(new Paragraph({spacing:{after:10},children:[new TextRun({text:r.name,bold:true,size:18})]}));
    children.push(new Paragraph({spacing:{after:10},children:[new TextRun({text:r.title,size:16})]}));
    children.push(new Paragraph({spacing:{after:100},children:[new TextRun({text:[r.email,r.phone].filter(Boolean).join(" | "),size:16})]}));
   });
  }

  const doc=new Document({sections:[{properties:{},children}]});
  const blob=await Packer.toBlob(doc);
  downloadBlob(`${fileBase()}.docx`,blob);
 };

 const print=()=>window.print();
 const setStatus=status=>{updateJob(job.id,{status,selectedStrategy:strategy});notify(`Status updated to ${status}.`)};
 const refs=(p.references||[]).filter(r=>r.name);
 return <section className="space-y-5">
  <div className="flex flex-wrap justify-between gap-3"><div><h2 className="text-xl font-bold">Recruiter-Style ATS Resume{ov&&<span className="text-[10px] text-amber-300 font-normal ml-2">(manually edited)</span>}</h2><p className="text-sm text-cyan-400">{job.title} · {job.company}</p><p className="text-xs text-slate-500 mt-1">One-page, single-column, text-first resume layout.</p></div><div className="no-print flex flex-wrap gap-2"><button onClick={()=>editMode?setEditMode(false):enterEdit()} className="bg-amber-600 px-3 py-2 rounded text-xs">{editMode?"Cancel Edit":"Edit Content"}</button><button onClick={downloadTxt} className="bg-slate-800 px-3 py-2 rounded text-xs">TXT</button><button onClick={downloadPDF} className="bg-cyan-600 px-3 py-2 rounded text-xs">Download PDF</button><button onClick={downloadDOCX} className="bg-blue-600 px-3 py-2 rounded text-xs">Download DOCX</button><button onClick={print} className="bg-slate-800 px-3 py-2 rounded text-xs">Print</button></div></div>

  {editMode&&draft&&<div className="no-print bg-slate-900 border border-amber-700 rounded-xl p-5 space-y-3">
   <h3 className="font-semibold text-amber-300">Editing this resume's content</h3>
   <p className="text-xs text-slate-500">Changes here apply only to this job's resume. Core Skills, Education and References always come straight from your Master Profile. Switching strategy below discards unsaved edits.</p>
   <div><label className="text-xs text-slate-400">Headline</label><input value={draft.headline} onChange={e=>setDraft({...draft,headline:e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm mt-1"/></div>
   <div><label className="text-xs text-slate-400">Professional Summary</label><textarea value={draft.summary} onChange={e=>setDraft({...draft,summary:e.target.value})} className="w-full h-24 bg-slate-950 border border-slate-700 rounded p-3 text-sm mt-1"/></div>
   <div><label className="text-xs text-slate-400">Professional Experience</label><textarea value={draft.experienceText} onChange={e=>setDraft({...draft,experienceText:e.target.value})} className="w-full h-40 bg-slate-950 border border-slate-700 rounded p-3 text-sm font-mono mt-1"/></div>
   <div><label className="text-xs text-slate-400">Projects</label><textarea value={draft.projectsText} onChange={e=>setDraft({...draft,projectsText:e.target.value})} className="w-full h-32 bg-slate-950 border border-slate-700 rounded p-3 text-sm font-mono mt-1"/></div>
   <div className="flex flex-wrap gap-2"><button onClick={saveEdit} className="bg-emerald-600 px-4 py-2 rounded text-xs">Save Edits</button><button onClick={()=>setEditMode(false)} className="bg-slate-800 px-4 py-2 rounded text-xs">Cancel</button>{ov&&<button onClick={resetToAuto} className="bg-red-900 px-4 py-2 rounded text-xs">Reset to Auto-generated</button>}</div>
  </div>}

  <div className="no-print bg-slate-900 border border-slate-800 rounded-xl p-5"><div className="flex justify-between items-center mb-3"><div><h3 className="font-semibold">Resume Strategy</h3><p className="text-xs text-slate-500">Auto-picked from this job's title and description — pick a different one any time.</p></div><span className="text-xs text-cyan-300">{cfg.label}</span></div><div className="grid md:grid-cols-4 gap-2">{Object.entries(ROLE_STRATEGIES).map(([k,v])=><button key={k} onClick={()=>{setStrategy(k);setEditMode(false);updateJob(job.id,{selectedStrategy:k})}} className={`p-3 rounded-lg border text-left text-xs ${strategy===k?'border-cyan-500 bg-cyan-950/50':'border-slate-800 bg-slate-950'}`}><b>{v.label}</b>{k===recommended&&<span className="ml-1 text-[9px] text-emerald-400">(recommended)</span>}<span className="block text-slate-500 mt-1">{k}</span></button>)}</div></div>
  <div className="grid md:grid-cols-2 gap-4 no-print"><Block title={`Compatibility Analysis: ${a.score}%`}><div className="grid grid-cols-2 gap-2"><Metric label="Keyword Evidence" value={a.skillPct}/><Metric label="Experience" value={a.expScore}/><Metric label="Projects" value={a.projectScore}/><Metric label="Preference" value={a.prefScore}/></div><p className="text-xs text-emerald-300 mt-3">Matched: {a.matched.slice(0,10).join(", ")||"None"}</p><p className="text-xs text-amber-300 mt-2">Potential gaps: {a.missing.slice(0,8).join(", ")||"None detected"}</p></Block><Block title="ATS Quality"><CheckRow ok text="Single-column, standard section headings"/><CheckRow ok text="No graphics, tables, icons, sidebars, or decorative resume elements"/><CheckRow ok text="Plain-text contact information"/><CheckRow ok={a.missing.length<8} text="Job keywords reviewed without inventing qualifications"/><p className="text-[11px] text-slate-500 mt-3">Compatibility is an internal estimate, not a real employer ATS score.</p></Block></div>
  <div className="bg-white text-black max-w-[794px] mx-auto p-8 md:p-10 shadow-2xl rounded print-resume">
    <header className="border-b pb-3 mb-4"><h1 className="text-3xl font-black tracking-wide">{(p.personal.fullName||"YOUR NAME").toUpperCase()}</h1>{finalHeadline&&<p className="text-[12px] font-bold text-sky-700 mt-1 tracking-wide">{finalHeadline.toUpperCase()}</p>}<p className="text-[10px] mt-1 leading-4">{contact}</p></header>
    <ResumeSection title="PROFESSIONAL SUMMARY"><p className="text-[10.5px] leading-5">{finalSummary}</p></ResumeSection>
    <ResumeSection title="CORE SKILLS"><div className="space-y-1">{p.skills.map((g,i)=><p key={i} className="text-[10px] leading-4"><b>{g.category}:</b> {g.items.filter(Boolean).join(", ")}</p>)}</div></ResumeSection>
    <ResumeSection title="PROFESSIONAL EXPERIENCE">{ov?<pre className="text-[10px] leading-4 whitespace-pre-wrap font-sans">{finalExperienceText}</pre>:exp.map((e,i)=><div key={i} className="mb-3"><div className="flex justify-between text-[10.5px]"><b>{e.role}, {e.company}</b><span>{[e.location,e.duration].filter(Boolean).join(" | ")}</span></div><ul className="list-disc ml-5 mt-1 text-[10px] leading-4">{e.bullets.map((b,n)=><li key={n}>{b}</li>)}</ul></div>)}</ResumeSection>
    <ResumeSection title="PROJECTS">{ov?<pre className="text-[10px] leading-4 whitespace-pre-wrap font-sans">{finalProjectsText}</pre>:projects.map((x,i)=><div key={i} className="mb-3"><p className="text-[10.5px]"><b>{x.name}</b>{x.subtitle&&<span>, {x.subtitle}</span>}</p><ul className="list-disc ml-5 mt-1 text-[10px] leading-4">{x.bullets.filter(Boolean).map((b,n)=><li key={n}>{b}</li>)}</ul></div>)}</ResumeSection>
    <ResumeSection title="EDUCATION">{p.education.map((e,i)=><div key={i} className="mb-2"><div className="flex justify-between text-[10.5px]"><b>{e.degree}</b><span>{e.date}</span></div><p className="text-[10px] leading-4">{[e.institution,e.score].filter(Boolean).join(" | ")}</p></div>)}</ResumeSection>
    {refs.length>0&&<ResumeSection title="REFERENCES"><div className="grid grid-cols-2 gap-4">{refs.map((r,i)=><div key={i} className="text-[10px] leading-4"><p className="font-bold text-[10.5px]">{r.name}</p><p>{r.title}</p><p>{[r.email,r.phone].filter(Boolean).join(" | ")}</p></div>)}</div></ResumeSection>}
  </div>
  <div className="no-print flex flex-wrap gap-2 justify-end"><button onClick={()=>setStatus("Saved")} className="bg-slate-800 px-3 py-2 rounded text-xs">Save</button><button onClick={()=>setStatus("Awaiting Approval")} className="bg-amber-600 px-3 py-2 rounded text-xs">Send to Approval</button><button onClick={()=>setStatus("Applied")} className="bg-emerald-600 px-3 py-2 rounded text-xs">Mark Applied</button>{job.url&&<a href={job.url} target="_blank" rel="noopener" className="bg-cyan-700 px-3 py-2 rounded text-xs">Open Job</a>}</div>
 </section>
}
function ResumeSection({title,children}){return <section className="mb-4"><h2 className="text-[10.5px] tracking-widest font-bold border-b border-black pb-1 mb-2">{title}</h2>{children}</section>}
function CheckRow({ok,text}){return <p className="text-xs flex gap-2 items-start"><span className={ok?'text-emerald-400':'text-amber-400'}>{ok?'✓':'!'}</span>{text}</p>}

function Tracker({jobs,setJobs}){const statuses=["Awaiting Review","Saved","Awaiting Approval","Applied","Interview","Rejected","Offer"];return <section><h2 className="text-xl font-bold mb-4">Application Tracker</h2><div className="space-y-3">{jobs.map(j=><div key={j.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap justify-between gap-3"><div><b>{j.title}</b><p className="text-sm text-slate-400">{j.company}</p></div><select value={j.status} onChange={e=>setJobs(jobs.map(x=>x.id===j.id?{...x,status:e.target.value}:x))} className="bg-slate-950 border border-slate-700 rounded p-2 text-sm">{statuses.map(s=><option key={s}>{s}</option>)}</select></div>)}</div></section>}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
