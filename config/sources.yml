# Where jobs come from. Turn a source off by setting enabled: false.
#
# A note on LinkedIn and Indeed. Both block automated access to their search
# pages in robots.txt and in their terms, and the fetcher honours that, so a
# scraper aimed at them would simply be skipped. Both will email you the exact
# same results if you create a job alert, so the email_alerts source below is
# the route that actually works and keeps working.

sources:

  bdjobs:
    enabled: true
    pages: 2
    fetch_details: true      # open each posting for the full requirement text
    detail_limit: 25         # per run, keeps the site load reasonable
    search_url: "https://jobs.bdjobs.com/jobsearch.asp?txtsearch={query}&pg={page}"
    # Selectors are config on purpose. When Bdjobs redesigns, run:
    #   python -m backend.pipeline probe --source bdjobs --query "quality assurance"
    # and paste the class it prints in here. No code change needed.
    selectors:
      card: "div.job-title-text, div.norm-jobs-wrapper, div.sout-jobs-wrapper, tr.jobs-list"
      title: "div.job-title-text a, a.job-title-text, .jobtitle a, h2 a"
      company: "div.comp-name-text, .comp-name a, .company-name"
      location: "div.locon-text, .job-location, .loc-text"
      deadline: "div.dead-text, .deadline, .job-deadline"
      link_contains: "jobdetail"

  email_alerts:
    enabled: false           # flip to true once IMAP_USER / IMAP_PASSWORD are set
    imap_host: imap.gmail.com
    folder: CareerPilot      # Gmail label your alert filter applies
    lookback_days: 3
    max_messages: 60
    user_env: IMAP_USER
    password_env: IMAP_PASSWORD

  rss:
    enabled: true
    feeds:
      # Any board that publishes a feed for a saved search goes here.
      # Remote-friendly feeds that are open by design:
      - url: "https://remoteok.com/remote-qa-jobs.rss"
        label: "RemoteOK"
        location: "Remote"
      - url: "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"
        label: "We Work Remotely"
        location: "Remote"

  careers:
    enabled: true
    sites:
      # Dhaka software houses that hire QA and rarely post on the big boards.
      # Add or remove freely. company and url are the only required fields.
      - company: "Innolytic IT Ltd."
        url: "https://innolytic.com.bd/career"
        location: "Dhanmondi, Dhaka"
      - company: "Brain Station 23"
        url: "https://brainstation-23.com/career/"
        location: "Mohakhali, Dhaka"
      - company: "Selise"
        url: "https://selisegroup.com/careers/"
        location: "Gulshan, Dhaka"

  local:
    enabled: true
    folders:
      - inbox                # drop a JSON file here and it joins the feed
      - fixtures             # sample data used by the offline test run
