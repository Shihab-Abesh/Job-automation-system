# Where jobs come from. Turn a source off by setting enabled: false.
#
# A note on LinkedIn and Indeed. Both block automated access to their search
# pages in robots.txt and in their terms, and the fetcher honours that, so a
# scraper aimed at them would simply be skipped. Both will email you the exact
# same results if you create a job alert, so the email_alerts source below is
# the route that actually works and keeps working.

sources:

  bdjobs:
    # Off since Bdjobs moved behind Cloudflare bot protection: the old search URL now
    # redirects to a page that answers automated clients with an empty response, so this
    # source returned 0 postings while still spending ~4 s per query trying. Turning it
    # back on is a one-word change if that ever gets fixed; run the probe command below.
    enabled: false
    pages: 2
    fetch_details: true      # open each posting for the full requirement text
    detail_limit: 25         # per run, keeps the site load reasonable
    search_url: "https://jobs.bdjobs.com/jobsearch.asp?txtsearch={query}&pg={page}"
    # Selectors are config on purpose. When Bdjobs redesigns, run:
    #   python -m backend.pipeline probe --source bdjobs --query "quality assurance"
    # and paste the class it prints in here. No code change needed.
    selectors:
      card: "div.job-title-text, div.norm-jobs-wrapper, div.sout-jobs-wrapper, tr.jobs-list"
      title: "div.job-title-text a, a.job-title-text, .jobtitle a, h2 a"
      company: "div.comp-name-text, .comp-name a, .company-name"
      location: "div.locon-text, .job-location, .loc-text"
      deadline: "div.dead-text, .deadline, .job-deadline"
      link_contains: "jobdetail"

  bdrecruit:
    enabled: true
    # bdrecruit.net is WordPress, so jobs come from its public REST API (robots.txt
    # allows it). No selectors to maintain, and the whole board is two requests.
    api_url: "https://bdrecruit.net/wp-json/wp/v2/job_listing"
    per_page: 100
    max_pages: 3             # 300 postings is well past what the site lists at once
    # queries = keep postings whose title matches one of your search queries
    # all     = keep every posting and let scoring sort them (noisy: it is a general board)
    relevance: queries

  # Any board that publishes schema.org JobPosting data (the markup Google Jobs reads)
  # can be added here with no new code. If a url contains {query} it is fetched once per
  # search query; otherwise it is fetched once and filtered against your queries.
  jsonld:
    enabled: true
    relevance: queries
    sites:
      - label: "BD Tech Jobs"
        # Its ?search= box now returns a single result, so the homepage list (about 20
        # postings, a handful of them fresh) is the reliable thing to read.
        url: "https://www.bdtechjobs.com/"
        location: "Dhaka, Bangladesh"
        # The site keeps very old postings listed (some from 2021) and stamps every one of
        # them with the same expiry date, so its own dates cannot say whether a job is live.
        # Age is judged from the posting date instead, and the fake shared deadline is dropped.
        max_age_days: 45
        ignore_deadline: true

  email_alerts:
    enabled: false           # flip to true once IMAP_USER / IMAP_PASSWORD are set
    imap_host: imap.gmail.com
    folder: CareerPilot      # Gmail label your alert filter applies
    lookback_days: 3
    max_messages: 60
    user_env: IMAP_USER
    password_env: IMAP_PASSWORD

  rss:
    enabled: true
    # queries = keep items whose title matches one of your search queries (default)
    # all     = keep everything
    relevance: queries
    feeds:
      # Any board that publishes a feed goes here. These are We Work Remotely categories.
      # Titles read "Company: Role", and each item says who may apply, so jobs limited to
      # "USA Only" and the like are dropped rather than shown as if you could take them.
      # (RemoteOK is gone: its feed returns HTTP 410.)
      - &wwr
        url: "https://weworkremotely.com/categories/remote-programming-jobs.rss"
        label: "We Work Remotely"
        location: "Remote"
        title_format: "company: role"
        regions: ["anywhere", "worldwide", "asia", "apac", "south asia", "bangladesh"]
      - <<: *wwr
        url: "https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss"
      - <<: *wwr
        url: "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"
      - <<: *wwr
        url: "https://weworkremotely.com/categories/remote-management-and-finance-jobs.rss"
      - <<: *wwr
        url: "https://weworkremotely.com/categories/remote-sales-and-marketing-jobs.rss"
      - <<: *wwr
        url: "https://weworkremotely.com/categories/remote-product-jobs.rss"

  careers:
    enabled: true
    sites:
      # Dhaka software houses that hire QA and rarely post on the big boards.
      # Add or remove freely. company and url are the only required fields.
      - company: "Innolytic IT Ltd."
        url: "https://innolytic.com.bd/career"
        location: "Dhanmondi, Dhaka"
      - company: "Brain Station 23"
        url: "https://brainstation-23.com/career/"
        location: "Mohakhali, Dhaka"
      - company: "Selise"
        url: "https://selisegroup.com/careers/"
        location: "Gulshan, Dhaka"

  local:
    enabled: true
    folders:
      - inbox                # drop a JSON file here and it joins the feed
      # fixtures/ is intentionally not read here: it's fake sample data with
      # non-working URLs (see fixtures/sample-jobs.json). The offline test
      # run reads it separately via tests/sources.yml, not this file.
