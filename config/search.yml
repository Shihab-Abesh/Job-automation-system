# What the pipeline looks for and what it refuses to pass on to you.
# Secrets never live here. They come from environment variables / GitHub Secrets.

dashboard_url: "https://shihab-abesh.github.io/Job-automation-system/"

paths:
  profile: config/profile.json
  output: data/jobs.json
  ledger: state/ledger.json
  digest: state/last_digest.json
  http_cache: .cache/http

# Leave empty to use preferences.titles from your master profile instead.
# A posting is kept when every word of one of these appears in its title, so keep
# them to two or more words ("data analyst", not "analyst"). Seniority prefixes
# such as "junior" are optional: "data analyst" also finds "Junior Data Analyst".
queries:
  # CSE / software
  - "software engineer"
  - "junior software engineer"
  - "web developer"
  - "PHP developer"
  - "system analyst"
  - "systems analyst"
  - "IT officer"
  - "IT executive"
  - "data analyst"
  # MIS / information systems
  - "MIS executive"
  - "MIS officer"
  - "information systems executive"
  # Management trainee (MTO) and MBA-style business roles
  - "management trainee officer"
  - "management trainee"
  - "trainee officer"
  - "graduate trainee"
  - "business analyst"
  - "business development executive"
  - "marketing executive"
  - "operations executive"
  - "project coordinator"
  # QA and support, still covered but no longer the focus
  - "QA engineer"
  - "QA analyst"
  - "software tester"
  - "application support engineer"

filters:
  min_salary_bdt: 20000     # your floor
  max_distance_km: 10       # from Tejgaon
  allow_remote: true
  allow_abroad: false       # a posting based in another country is demoted unless it is remote
  retention_days: 45        # drop stale postings after this
  drop_expired: true        # and drop anything past its deadline

fetch:
  min_interval_seconds: 4.0 # gap between requests to the same host
  timeout_seconds: 25
  respect_robots: true      # leave this on

notify:
  email:
    enabled: true
    # to: left unset on purpose. It falls back to SMTP_USER, which is
    # a secret, so your address never lands in a public repo.
    smtp_host: smtp.gmail.com
    smtp_port: 587
    user_env: SMTP_USER
    password_env: SMTP_PASSWORD
    min_priority: B         # B and above. Set to A if the digest gets noisy.
  # Works with no secrets at all. Each run that finds new matches opens one issue listing
  # them, and GitHub notifies you (email and the mobile app) because you are @mentioned.
  # Issues on a public repository are public: this lists public job postings only, never
  # your decisions about them. Set enabled: false if you would rather it did not.
  github_issue:
    enabled: true
    mention: "Shihab-Abesh"
    min_priority: B
    labels: ["new-jobs"]
  webhook:
    enabled: false
    url_env: WEBHOOK_URL
    min_priority: A
